# lspkit's profiler generates its wire model with typeDiagram: lsp-profiler's
# build.rs runs it on every Rust build that compiles the profiler, and
# `make _profiler_ui` runs it before the shared UI package compiles
# [PROF-LSP-RUNTIME]. Pinned to the version lspkit's own CI installs.
name: Install typeDiagram
description: Puts the typeDiagram CLI that lspkit's profiler code generation needs on PATH.
inputs:
  node-version:
    description: Node.js version typeDiagram runs on (it needs 20 or later)
    required: false
    default: "24"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install typeDiagram
      shell: bash
      run: |-
        if [ "$(typediagram --version 2>/dev/null || true)" != 'typediagram 0.11.0' ]; then
          npm install -g typediagram@0.11.0
        fi
        typediagram --version
