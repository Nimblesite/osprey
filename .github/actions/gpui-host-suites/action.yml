name: GPUI host suites
description: >-
  On a Mac or Linux runner whose compiler and runtime are built: the native framework suite, the
  UI test framework suites, the example suites, the GPUI host's tests and clippy, and every desktop app's headless smoke run.
  Each GPUI job names its own system, so the checks are pinned by name; the suites they share live here.
runs:
  using: composite
  steps:
    - name: Native framework suite
      shell: bash
      run: ./target/release/osprey test packages/native/tests

    # [UI-MACHINE-TEST]: the same suites as `make _ui-test`.
    - name: UI test framework suites
      shell: bash
      run: |
        ./target/release/osprey test packages/uitest/tests
        ./target/release/osprey test examples/casting/test
        ./target/release/osprey test packages/signal_flow/tests
        ./target/release/osprey test examples/synth/test

    - name: Example suites
      shell: bash
      run: |
        ./target/release/osprey test examples/gpui/flock/test
        ./target/release/osprey test examples/gpui/painting/test
        ./target/release/osprey test examples/storage/test

    # Each app linked into the host and started without a window, its recorded events replayed
    # through the real C boundary: the probe, Flock, Painting, Signal flow, the synth and Casting.
    # First: the probe's run rebuilds the archive the host's own tests link.
    - name: Every desktop app's headless smoke
      shell: bash
      run: make _gpui-smoke

    - name: Host tests and clippy
      shell: bash
      working-directory: hosts/gpui
      run: |
        cargo test --release
        cargo clippy --release -- -D warnings

    - name: Mac archive and host string ownership
      if: runner.os == 'macOS'
      shell: bash
      run: bash scripts/test-macos.sh
      env:
        OSPREY_BIN: ${{ github.workspace }}/target/release/osprey
