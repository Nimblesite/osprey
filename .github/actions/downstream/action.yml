name: "Lay a split repository"
description: >-
  Checks out the main branch of a split repository (Nimblesite/osprey-packages or
  Nimblesite/perception) and lays its files over this checkout at their original paths, for CI
  tests only [REPO-SPLIT-CANARY].
inputs:
  name:
    description: "osprey-packages or perception"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      with:
        repository: Nimblesite/${{ inputs.name }}
        ref: main
        path: target/downstream/${{ inputs.name }}
        lfs: true
    - name: Lay its files over this checkout
      shell: bash
      run: bash scripts/ci/downstream.sh ${{ inputs.name }}
