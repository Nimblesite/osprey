name: Detect CI scope
description: Classify changed files consistently for Linux, Windows and content checks
outputs:
  code:
    description: Compiler, runtime, integration or CI changes; unknown files fail closed
    value: ${{ steps.scope.outputs.code }}
  website:
    description: Website files changed
    value: ${{ steps.scope.outputs.website }}
  book:
    description: Book content, assets, examples or tooling changed
    value: ${{ steps.scope.outputs.book }}
  benchmarks:
    description: Benchmark data, programs or tooling changed
    value: ${{ steps.scope.outputs.benchmarks }}
  programs:
    description: Possible Osprey programs (.osp, .ospml, .ospo, .py) or osprey.toml manifests changed, wherever they live
    value: ${{ steps.scope.outputs.programs }}
runs:
  using: composite
  steps:
    - name: Classify changed files
      id: scope
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
          git fetch --no-tags --depth=1 origin "${PR_BASE_SHA:?Missing pull request base SHA}"
          git diff --no-renames --name-only -z "$PR_BASE_SHA" HEAD -- | node scripts/ci/ci-scope.mjs
        else
          node scripts/ci/ci-scope.mjs --all
        fi
