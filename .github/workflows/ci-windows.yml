name: CI (Windows)

# Windows build + smoke test for the Osprey compiler (Rust). ci.yml calls it on
# every PR to main, under its root `ci` job; merging to main
# triggers nothing.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Not github.workflow: a called workflow takes its caller's name, and sharing its group cancels it.
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Website-only PRs don't touch the compiler, so `windows-core` skips — but it
  # must skip at the JOB level, never via an `on: paths-ignore:` filter. A
  # workflow that path-filtering skipped never reports, which leaves ci.yml's
  # root job waiting; a job skipped by `if:` reports as PASSING.
  changes:
    name: Detect changed areas (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-ci-scope
        id: filter

  # The WinUI host and its examples in a real window (plan 0037), and the GPUI host on each desktop
  # system (plan 0037). ci.yml calls winui.yml and gpui.yml on every pull request; a manual run of
  # this workflow also runs them, because a workflow not yet on main cannot be dispatched by itself.
  winui:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/winui.yml
    secrets: inherit

  gpui:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/gpui.yml

  # The runtime archives and the release osprey.exe, built once. The smoke tests
  # and corpora, and the type disciplines, run beside each other on that build.
  windows-build:
    name: Windows Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No duplication gate here. Deslop measures source text, so its verdict is
      # platform-independent, so running it on a second OS would only duplicate
      # ci.yml's required `ci` job. The gate lives there.

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0

      # Restored here and saved straight after the build, as winui.yml does: the combined
      # actions/cache saves only when the whole job succeeds, so a job cancelled after the
      # build threw its cold build away and the next run started just as cold.
      - name: Restore cargo registry + target
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-osprey-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('src/toolchain/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-osprey-

      - uses: ./.github/actions/setup-windows-msys2

      # Build the C runtime archives with the MinGW toolchain. The root
      # Makefile auto-detects this MSYS2 shell (via $MSYSTEM) and runs the
      # recipe under bash; only the compiler/archiver need overriding.
      - name: Build C runtime archives (MinGW)
        shell: msys2 {0}
        run: make _runtime CC=gcc AR=ar

      # The collector must scan roots in its callers, not only the frames below
      # the first allocation. This focused test catches platform stack-bound
      # discovery errors before the larger language corpus obscures the crash.
      - name: GC keeps roots in outer caller stack frames
        shell: msys2 {0}
        run: make _test_gc_stack_root CC=gcc

      # [FFI-FILE-SERVER-FOLDER] Backslashes, drive and stream colons, symlinks and
      # subfolders only bite on Windows: the file server suite proves each answers 404
      # here, over real loopback sockets.
      - name: File server refuses hostile names and links
        shell: msys2 {0}
        run: make _test_file_server CC=gcc

      - name: Build osprey (release)
        run: cargo build --manifest-path src/toolchain/Cargo.toml --release -p osprey-cli

      - name: Save cargo registry + target
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Verify version contract
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe --version | grep -Fx "osprey 0.0.0-dev"

      - uses: actions/upload-artifact@v7
        with:
          name: osprey-windows
          path: |
            target/release/osprey.exe
            src/toolchain/compiler/bin/*.a
          retention-days: 1
          if-no-files-found: error

  windows-core:
    name: Windows Core Smoke Test & Corpora
    needs: [changes, windows-build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-msys2

      - uses: actions/download-artifact@v8
        with:
          name: osprey-windows

      # The split repositories' canaries on Windows [REPO-SPLIT-CANARY]: the main branches of
      # Nimblesite/osprey-packages (fixtures, the package frontend, the consumer flow against
      # sample-registry) and Nimblesite/perception (the synth journeys and the song renderer), each
      # running its own `make canary` with this build's compiler, as Linux and macOS do.
      - name: Lay the package manager (Nimblesite/osprey-packages)
        uses: ./.github/actions/downstream
        with:
          name: osprey-packages
      - name: Lay Perception (Nimblesite/perception)
        uses: ./.github/actions/downstream
        with:
          name: perception
      - name: Both canaries
        shell: msys2 {0}
        run: make _canaries OSPREY_PREBUILT=1 CC=gcc AR=ar

      # fiber_showcase exercises spawn/await/yield/channels/select — i.e. the
      # winpthreads-backed fiber runtime. The feature omnibus covers lists/maps/
      # strings/pattern-matching. Neither uses HTTP, so both are valid core
      # Windows smoke tests; clang resolves to the MSYS2 LLVM inside this shell.
      - name: Smoke test — fiber showcase
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe test src/osprey/tests/regressions/fiber/fiber_showcase.test.osp --quiet > out.txt
          cat out.txt
          grep -Fq "=== Fiber Showcase Complete ===" out.txt
          grep -Fq "map-reduce total = 1400" out.txt
          grep -Fq "pipeline = 200" out.txt

      - name: Smoke test — feature omnibus assertion suite
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe test src/osprey/tests/core/feature_composition/feature_omnibus.test.osp --quiet > omni.txt
          cat omni.txt

      # Each invocation recursively exercises both Default and ML programs with
      # internal assertions, including cross-feature interaction scenarios.
      - name: Core language assertion corpus — GC
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OSPREY_TEST_JOBS=1 ./target/release/osprey.exe test src/osprey/tests --memory=gc

      - name: Core language assertion corpus — ARC
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OSPREY_ARC_DEBUG=1 OSPREY_TEST_JOBS=1 ./target/release/osprey.exe test src/osprey/tests --memory=arc

  # [TYPES-DISCIPLINE-REFERENCE] Every reference discipline through the whole seam on
  # Windows: each checker built by osprey.exe and spawned through cmd.exe, the
  # round trips under GC and ARC, the rejected variants against their goldens and
  # both checker suites. Linux CI runs the wasm32 legs; this runner has no WASI sysroot.
  windows-disciplines:
    name: Windows Type Disciplines
    needs: [changes, windows-build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-windows-msys2

      - uses: actions/download-artifact@v8
        with:
          name: osprey-windows

      - name: Type disciplines (bounded, dependent, lean, passthrough)
        shell: msys2 {0}
        run: make _test_disciplines DISCIPLINE_WASM=0 BIN=target/release/osprey.exe OSPREY_PREBUILT=1
