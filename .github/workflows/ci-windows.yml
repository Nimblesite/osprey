name: CI (Windows)

# Windows build + smoke test for the Osprey compiler (Rust). ci.yml calls it on
# every PR to main, under its root `ci` job; merging to main
# triggers nothing.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Not github.workflow: a called workflow takes its caller's name, and sharing its group cancels it.
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Website-only PRs don't touch the compiler, so `windows-core` skips — but it
  # must skip at the JOB level, never via an `on: paths-ignore:` filter. A
  # workflow that path-filtering skipped never reports, which leaves its required
  # checks pending; a job skipped by `if:` reports as PASSING.
  changes:
    name: Detect changed areas (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-ci-scope
        id: filter

  # The WinUI host and its examples in a real window (plan 0038), and the GPUI host on each desktop
  # system (plan 0036). ci.yml calls winui.yml and gpui.yml on every pull request; a manual run of
  # this workflow also runs them, because a workflow not yet on main cannot be dispatched by itself.
  winui:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/winui.yml

  gpui:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/gpui.yml

  windows-core:
    name: Windows Core Build & Smoke Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true

      # No duplication gate here. Deslop measures source text, so its verdict is
      # platform-independent, so running it on a second OS would only duplicate
      # ci.yml's required `ci` job. The gate lives there.

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-osprey-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-osprey-

      # gcc + winpthreads back the fiber/effects C runtime; the `clang` package
      # provides the MinGW clang driver (`/ucrt64/bin/clang.exe`) osprey shells
      # out to when linking — the `llvm` package ships only the LLVM tools
      # (llc/opt), not the driver, so without `clang` osprey would fall back to
      # the runner's system MSVC clang and fail to link the MinGW runtime.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3

      # Build the C runtime archives with the MinGW toolchain. The root
      # Makefile auto-detects this MSYS2 shell (via $MSYSTEM) and runs the
      # recipe under bash; only the compiler/archiver need overriding.
      - name: Build C runtime archives (MinGW)
        shell: msys2 {0}
        run: make _runtime CC=gcc AR=ar

      # The collector must scan roots in its callers, not only the frames below
      # the first allocation. This focused test catches platform stack-bound
      # discovery errors before the larger language corpus obscures the crash.
      - name: GC keeps roots in outer caller stack frames
        shell: msys2 {0}
        run: make _test_gc_stack_root CC=gcc

      # The language server mounts lspkit's profiler, whose build script
      # generates its wire model with typeDiagram [PROF-LSP-HOST].
      - name: Install typeDiagram
        uses: ./.github/actions/typediagram

      - name: Build osprey (release)
        run: cargo build --release -p osprey-cli

      - name: Verify version contract
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe --version | grep -Fx "osprey 0.0.0-dev"

      # osprey.exe is a NATIVE Windows process: when it shells out to link the
      # emitted IR it searches the Windows PATH, where the runner's system
      # (MSVC-target) clang shadows the MSYS2 one — that clang can't link the
      # MinGW-built runtime archive. Pin OSPREY_CC to the UCRT64 clang via a
      # Windows-style path (cygpath -m) so native CreateProcess can find it.
      - name: Pin the MinGW clang for osprey --run
        shell: msys2 {0}
        run: |
          set -euo pipefail
          CC_PATH="$(cygpath -m /ucrt64/bin/clang.exe)"
          "$CC_PATH" --version | head -1
          echo "OSPREY_CC=$CC_PATH" >> "$GITHUB_ENV"

      # release.yml compiles the package manager client on this same runner
      # and ships it in the win32 tarball, so a Windows-only compile failure
      # of packages/manager/cli must be caught here, not at tag time.
      # --no-warnings skips the warning pass (see scripts/make/extension.mk).
      - name: Compile package manager client
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe build packages/manager/cli --quiet --no-warnings -o target/osprey-pkg.exe
          test -s target/osprey-pkg.exe

      # fiber_showcase exercises spawn/await/yield/channels/select — i.e. the
      # winpthreads-backed fiber runtime. The feature omnibus covers lists/maps/
      # strings/pattern-matching. Neither uses HTTP, so both are valid core
      # Windows smoke tests; clang resolves to the MSYS2 LLVM inside this shell.
      - name: Smoke test — fiber showcase
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe test tests/regressions/fiber/fiber_showcase.test.osp --quiet > out.txt
          cat out.txt
          grep -Fq "=== Fiber Showcase Complete ===" out.txt
          grep -Fq "map-reduce total = 1400" out.txt
          grep -Fq "pipeline = 200" out.txt

      - name: Smoke test — feature omnibus assertion suite
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe test tests/core/feature_composition/feature_omnibus.test.osp --quiet > omni.txt
          cat omni.txt

      # Each invocation recursively exercises both Default and ML programs with
      # internal assertions, including cross-feature interaction scenarios.
      - name: Core language assertion corpus — no memory management
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OSPREY_TEST_JOBS=1 ./target/release/osprey.exe test tests

      - name: Core language assertion corpus — GC
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OSPREY_TEST_JOBS=1 ./target/release/osprey.exe test tests --memory=gc

      - name: Core language assertion corpus — ARC
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OSPREY_ARC_DEBUG=1 OSPREY_TEST_JOBS=1 ./target/release/osprey.exe test tests --memory=arc
