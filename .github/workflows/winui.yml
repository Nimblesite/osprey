name: WinUI host

# Plan 0038 ([WINUI-HOST]): build the CLI and its MinGW runtime, compile the apps to windows-x64
# DLLs, then run the WinUI host's tests and publish the host with
# Native AOT. The tests drive the real DLL boundary, the envelope, the region store, the
# capabilities and the folder walk, and guard coverage, no XAML and host neutrality. No test opens
# a window. Then every app runs as its own sandboxed MSIX package in a real window on the runner's
# desktop, driven by its self-test script, and each picture is compared with the app's screenshot
# goldens (plan 0046); the pictures and any diffs are kept as an artifact.
#
# ci.yml calls this workflow on every pull request, and its root `ci` job, the required check,
# needs both jobs here. A PR that changes no code skips the host at the job level, which reports
# as passing.
on:
  workflow_dispatch:
  # ci.yml calls it on every pull request, and ci-windows.yml on a manual run, because a workflow
  # not yet on main cannot be dispatched.
  workflow_call:

concurrency:
  # Not github.workflow: a called workflow takes its caller's name, and sharing its group cancels it.
  group: winui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas (WinUI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-ci-scope
        id: filter

  winui:
    name: WinUI host (windows-latest)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # The apps' skins and the screenshot goldens are LFS pictures; the rest of the repo's stay unpulled.
      - name: Pull the apps' LFS pictures
        run: git lfs install --local && git lfs pull --include="examples/**,hosts/**,packages/**"

      # The C runtime is built with MinGW (as in ci-windows.yml), and the UCRT64 clang links the
      # application DLL against it.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build C runtime archives (MinGW)
        shell: msys2 {0}
        run: make _runtime CC=gcc AR=ar

      # Restored here and saved straight after the build, so a later step's failure keeps it.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: winui-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: winui-cargo-

      - name: Build osprey (release)
        run: cargo build --release -p osprey-cli

      - name: Save the cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Pin the MinGW clang and llvm-ar
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "OSPREY_CC=$(cygpath -m /ucrt64/bin/clang.exe)" >> "$GITHUB_ENV"
          echo "OSPREY_AR=$(cygpath -m /ucrt64/bin/llvm-ar.exe)" >> "$GITHUB_ENV"

      - name: The apps' DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p examples/storage/build examples/gpui/flock/build examples/gpui/painting/build packages/signal_flow/app/build hosts/gpui/probe/build examples/casting/build
          pids=()
          ./target/release/osprey.exe build examples/storage --target=windows-x64 -o examples/storage/build/storage.dll &
          pids+=("$!")
          ./target/release/osprey.exe build examples/gpui/flock --target=windows-x64 --no-warnings -o examples/gpui/flock/build/flock.dll &
          pids+=("$!")
          ./target/release/osprey.exe build examples/gpui/painting --target=windows-x64 --no-warnings -o examples/gpui/painting/build/painting.dll &
          pids+=("$!")
          ./target/release/osprey.exe build packages/signal_flow/app --target=windows-x64 --no-warnings -o packages/signal_flow/app/build/signal-flow.dll &
          pids+=("$!")
          ./target/release/osprey.exe build hosts/gpui/probe --target=windows-x64 --no-warnings -o hosts/gpui/probe/build/probe.dll &
          pids+=("$!")
          ./target/release/osprey.exe build examples/casting --target=windows-x64 --no-warnings -o examples/casting/build/casting.dll &
          pids+=("$!")
          for p in "${pids[@]}"; do wait "$p"; done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # PowerShell, not MSYS2: the MSYS2 runtime enables the backup privilege, which reads folders
      # their ACLs deny and so would skip the walk's unreadable-folder case.
      - name: Host tests
        working-directory: hosts/winui
        shell: pwsh
        run: dotnet test --project OspreyHost.Tests

      # Native AOT links with Visual Studio's C++ tools, which it finds through vswhere.
      - name: Native AOT publish
        working-directory: hosts/winui
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish OspreyHost -c Release

      # What a window can see here: the host needs a visible window station, and the graphics
      # scenes need a desktop compositor for their swap chains.
      - name: The runner's desktop
        shell: pwsh
        run: |
          $uac = (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System).EnableLUA
          "session $((Get-Process -Id $PID).SessionId), user-interactive $([Environment]::UserInteractive), UAC $uac"
          query user 2>&1 | Out-String
          exit 0  # query user reports through its exit code even when it lists a session

      - name: Graphics scenes on Direct3D 12
        if: ${{ !cancelled() }}
        shell: msys2 {0}
        # The runner has no GPU, so Direct3D 12 draws with WARP on the CPU: a few frames per scene.
        run: make _graphics-smoke CC=gcc BIN=target/release/osprey.exe GFX_SMOKE_FRAMES=10

      - name: Pictures of the graphics scenes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: examples/graphics/pictures.ps1 -Shots "${{ runner.temp }}/self-test/graphics" -Msys "${{ steps.msys2.outputs.msys2-location }}"

      # Each app is its own MSIX package in an AppContainer [WINUI-HOST-SANDBOX], registered as a loose
      # layout, which Developer Mode allows without signing.
      - name: Developer Mode for loose packages
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

      # The runner's desktop is 1024 by 768, smaller than Signal Flow's window, and a golden on screen
      # holds what the screen shows of the whole window.
      - name: A desktop that holds every app's window
        shell: pwsh
        run: scripts/display-size.ps1 -Width 1920 -Height 1080

      # Every app in a real window on the runner's desktop, inside its sandbox, driven by its
      # self-test; each picture of the window's content is compared with the app's goldens and a
      # diff picture is kept for any that differs. Windows Error Reporting keeps a crashed host's dump.
      - name: Every app sandboxed in a real window, against its screenshot goldens
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # Casting's cast-browse helper compiles with the MinGW above, not the runner's own C:\msys64.
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $dumps = "${{ runner.temp }}/dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\OspreyHost.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $apps = [ordered]@{
            storage = 'examples/storage/build/storage.dll'
            flock = 'examples/gpui/flock/build/flock.dll'
            painting = 'examples/gpui/painting/build/painting.dll'
            'signal-flow' = 'packages/signal_flow/app/build/signal-flow.dll'
            probe = 'hosts/gpui/probe/build/probe.dll'
            casting = 'examples/casting/build/casting.dll'
          }
          $failed = @()
          foreach ($app in $apps.Keys) {
            "== $app"
            try { hosts/winui/app.ps1 -App $app -Dll $apps[$app] -Test } catch { $_; $failed += $app }
          }
          if ($failed) { throw "Self-tests or goldens failed: $($failed -join ', ')" }

      # The whole system drive, as a person would first measure it: the walk meets folders it may not
      # read and may stop at its two-minute deadline, then Users opens from its row.
      - name: Osprey Storage measures the C drive in a real window
        if: ${{ !cancelled() }}
        shell: pwsh
        run: >-
          hosts/winui/self-test.ps1
          -Exe hosts/winui/OspreyHost/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/OspreyHost.exe
          -Dll examples/storage/build/storage.dll
          -Script examples/storage/self-test-drive.json
          -Shots "${{ runner.temp }}/self-test/storage-drive"
          -Dumps "${{ runner.temp }}/dumps"
          -Arguments 'C:\'
          -Seconds 480

      - name: Keep the window's pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winui-self-test
          path: |
            ${{ runner.temp }}/self-test
            target/winui-shots
          if-no-files-found: warn
