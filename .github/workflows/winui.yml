name: WinUI host

# Plan 0038 ([WINUI-HOST]): build the CLI and its MinGW runtime, run Osprey Storage's suite and
# compile Storage to a windows-x64 DLL, then run the WinUI host's tests and publish the host with
# Native AOT. The tests drive the real DLL boundary, the envelope, the region store, the
# capabilities and the folder walk, and guard coverage, no XAML and host neutrality. No test opens
# a window. Then Osprey Storage runs in a real window on the runner's desktop, driven by its
# self-test script, and the pictures of each step are kept as an artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - "hosts/winui/**"
      - "packages/native/**"
      - "examples/storage/**"
      - "crates/osprey-cli/src/desktop.rs"
      - "crates/osprey-cli/src/ios_abi.rs"
      - "crates/osprey-cli/src/windows_dll.rs"
      - "crates/osprey-cli/src/windows_dll_tests.rs"
      - "compiler/runtime/**"
      - ".github/workflows/winui.yml"
  workflow_dispatch:
  # ci-windows.yml calls it on a manual run, because a workflow not yet on main cannot be dispatched.
  workflow_call:

concurrency:
  # Not github.workflow: a called workflow takes its caller's name, and sharing its group cancels it.
  group: winui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winui:
    name: WinUI host (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The C runtime is built with MinGW (as in ci-windows.yml), and the UCRT64 clang links the
      # application DLL against it.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install typeDiagram
        uses: ./.github/actions/typediagram

      - name: Build C runtime archives (MinGW)
        shell: msys2 {0}
        run: make _runtime CC=gcc AR=ar

      - name: Build osprey (release)
        run: cargo build --release -p osprey-cli

      - name: Pin the MinGW clang and llvm-ar
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "OSPREY_CC=$(cygpath -m /ucrt64/bin/clang.exe)" >> "$GITHUB_ENV"
          echo "OSPREY_AR=$(cygpath -m /ucrt64/bin/llvm-ar.exe)" >> "$GITHUB_ENV"

      - name: Storage suite and DLL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./target/release/osprey.exe test examples/storage/test
          mkdir -p examples/storage/build
          ./target/release/osprey.exe build examples/storage --target=windows-x64 -o examples/storage/build/storage.dll

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # PowerShell, not MSYS2: the MSYS2 runtime enables the backup privilege, which reads folders
      # their ACLs deny and so would skip the walk's unreadable-folder case.
      - name: Host tests
        working-directory: hosts/winui
        shell: pwsh
        run: dotnet test --project OspreyHost.Tests

      # Native AOT links with Visual Studio's C++ tools, which it finds through vswhere.
      - name: Native AOT publish
        working-directory: hosts/winui
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish OspreyHost -c Release

      - name: Osprey Storage in a real window
        shell: pwsh
        run: >-
          examples/storage/self-test.ps1
          -Exe hosts/winui/OspreyHost/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/OspreyHost.exe
          -Dll examples/storage/build/storage.dll
          -Shots "${{ runner.temp }}/self-test/storage"

      - name: Keep the window's pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winui-self-test
          path: ${{ runner.temp }}/self-test
          if-no-files-found: warn
