# agent-pmo:74cf183
name: CI

# CI runs ONLY on PRs to main. Merging to main triggers nothing; releases are
# tag-triggered (release.yml). See docs/RELEASING.md.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change detection ───────────────────────────────────────────────────────
  # Website-only PRs (changes confined to website/**) don't need the compiler, C
  # runtime, VS Code extension or web-compiler toolchain. Detect whether anything
  # OUTSIDE website/ changed so the heavy jobs below can skip.
  #
  # Required-check note: the `ci` job ("Test, Format, Build & Validate") is the
  # required status check on `main` (ruleset 6154907). Skipping a job via an `if:`
  # condition reports its check as "skipped", which branch protection treats as
  # PASSING — so a website-only PR still merges. Do NOT convert this to an
  # `on: paths:` filter: a workflow skipped by path filtering leaves the required
  # check pending forever and blocks the merge.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
            code:
              - '!website/**'

  ci:
    # IMPORTANT: this name is the required status check on `main` (ruleset 6154907).
    # Renaming it will break branch protection — coordinate with the ruleset update.
    name: Test, Format, Build & Validate
    needs: changes
    # Skip the full compiler/runtime/extension pipeline for website-only PRs.
    # A skipped required check reports as passing (see the `changes` job note).
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION. The "~15 min" this budget was written for was never a
    # measurement of a COMPLETE run: the job used to die early — at the Rust
    # tests, then the C compile, then the C coverage gate — so no run had ever
    # reached the later stages. The first run that got through them all was
    # killed at 30 minutes mid-way through the extension suite. Measured stage
    # times from that run:
    #
    #   C + wasm runtime archives   2m30s
    #   lint + build                  25s
    #   rust tests with coverage    2m35s
    #   C suites + coverage gate      35s
    #   language corpus             2m35s
    #   golden comparison           2m50s
    #   GC conformance              3m05s
    #   ARC conformance             2m50s
    #   extension suite            12m+ (killed, still progressing)
    #
    # The extension suite dominates: it drives a real VS Code under xvfb and
    # spawns lldb-dap per debug-adapter case, which is minutes slower on a
    # runner than the ~2 min it takes locally. 60 leaves headroom for that
    # without hiding a hang — a stuck run still fails, just later.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            vscode-extension/package-lock.json
            webcompiler/package-lock.json
            website/package-lock.json
            examples/projects/modules/e2e/package-lock.json

      # Rust toolchain + clang/LLVM + C runtime archives + the osprey binary.
      - name: Setup Osprey Compiler
        uses: ./.github/actions/setup-osprey-compiler

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: ./vscode-extension

      - name: Install jq, Xvfb and coverage tooling
        # jq reads coverage-thresholds.json; Xvfb backs the VS Code extension
        # tests; cargo-llvm-cov produces the Rust lcov report `make test` checks.
        run: |
          sudo apt-get install -y jq xvfb
          cargo install cargo-llvm-cov --locked || true

      # The `ci` job's coverage gate already DEPENDS on this toolchain, so it is
      # not optional here. `osprey-cli`'s wasm end-to-end test
      # (crates/osprey-cli/src/wasm.rs) self-skips unless wasm-ld, a WASI
      # sysroot and libosprey_runtime_wasm.a are all present; skipping it drops
      # osprey-cli from 96.7% to 94.8%, under its 95% floor, and fails this
      # required check. Without these steps the gate could only ever go red, so
      # the cost is already being paid — this makes the dependency explicit
      # instead of leaving it to whatever a runner happens to have installed.
      - name: Install lld (wasm-ld) and a WASI sysroot
        run: |
          sudo apt-get install -y lld wabt
          WASI_VERSION=24
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sysroot-${WASI_VERSION}.0.tar.gz"
          # The tarball unpacks to a versioned top dir; strip it so the sysroot
          # lands at a stable path containing lib/wasm32-wasip1.
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
          wasm-ld --version

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      # [EDITOR-VERSIONING] Keep shipwright.json valid against the in-repo
      # Shipwright schema. Do not use @nimblesite/shipwright-validate-manifest:
      # published versions currently ship without their bundled schemas.
      - name: Validate deployment manifest
        run: npm run test:shipwright
        working-directory: ./vscode-extension

      # Official duplication gate. This MUST live in the `ci` job: `ci` is the
      # required status check on `main` (ruleset 6154907), so a gate anywhere
      # else cannot block a merge. It previously sat in ci-windows.yml, whose
      # `windows-core` job is explicitly NOT required — which silently turned
      # the duplication ceiling into a suggestion. The committed .deslop.toml is
      # the threshold source (deslop exits 3 when over); reports stay ephemeral
      # rather than consuming Actions artifact storage. `version` is explicit
      # because the action is pinned to the immutable commit for v0.27.0 rather
      # than its mutable tag. Docs: https://deslop.live/docs/github-action/
      - name: Deslop duplication gate
        uses: Nimblesite/Deslop@f1915e6328165f23a4bd1c6cd4262a64dd7d9033 # v0.27.0
        with:
          version: "0.27.0"
          upload-artifact: "false"

      - name: Lint
        # Duplication is gated by the Deslop action step above, so this internal
        # target runs the remaining linters without re-invoking the local CLI.
        run: make _lint

      # make test = fail-fast + per-project coverage + threshold enforcement +
      # the Default/ML assertion corpus under tests/ in the compiler-default,
      # GC, and ARC memory modes, PLUS the byte-exact stdout goldens (a program
      # whose assertions all pass can still have stopped printing in the right
      # order — only the golden sees that).
      # Thresholds live in coverage-thresholds.json.
      # Xvfb is needed because vscode-extension
      # tests spawn a real VS Code Electron build.
      - name: Test
        run: xvfb-run -a make test

      # Talon Bank native unit tests: the pure domain layer (money, json,
      # accounts) exercised through the built-in `osprey test` harness.
      - name: Bank native tests (osprey test)
        run: make bank-test

      # Talon Bank modules showcase (examples/projects/modules): real Chromium
      # drives the compiled osprey binary serving its HTTP API and web UI.
      - name: Install bank e2e dependencies
        run: npm ci
        working-directory: ./examples/projects/modules/e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./examples/projects/modules/e2e
      - name: Bank e2e (Playwright)
        run: npx playwright test
        working-directory: ./examples/projects/modules/e2e
      - name: Upload bank e2e results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bank-e2e-results
          path: examples/projects/modules/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: |
            test.log
            vscode-extension/test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            vscode-extension/coverage/
          retention-days: 7

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/osprey
            compiler/lib/
            vscode-extension/out/
          retention-days: 7

      - name: Test example compilation and execution
        run: |
          target/release/osprey test tests/regressions/basics/math/comprehensive_math.test.osp
          target/release/osprey test tests/core/feature_composition/feature_omnibus.test.osp

      - name: Test Web Compiler
        run: |
          cd webcompiler
          docker build -t osprey-web-compiler-ci -f Dockerfile ..
          docker run -d --name osprey-web-compiler-ci -p 3001:3001 \
            -e NODE_ENV=production -e PORT=3001 \
            --memory=256m --memory-reservation=256m \
            osprey-web-compiler-ci
          sleep 15
          chmod +x test.sh && ./test.sh
          docker stop osprey-web-compiler-ci
          docker rm osprey-web-compiler-ci

  # ─── Focused compiler gate ──────────────────────────────────────────────────
  # Fast signal on the compiler alone: format + clippy (-D warnings: clippy::all
  # + pedantic + restriction) + workspace tests + the complete assertion-driven
  # Default/ML language corpus in all three memory modes.
  rust:
    name: Rust Compiler (fmt, clippy, test, corpus)
    needs: changes
    # Compiler-only gate — irrelevant to website-only PRs, so skip them.
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-

      - name: Install clang/LLVM, OpenSSL, SQLite and zsh
        # clang links the osprey-emitted IR; libssl-dev/libsqlite3-dev satisfy
        # the HTTP and FFI-database runtimes the assertion corpus links; zsh
        # runs its GC and ARC backend harness.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libssl-dev libsqlite3-dev pkg-config zsh
          clang --version

      - name: Build the C runtime archives (pure C — osprey links these)
        run: make _runtime

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Core language assertion corpus — no memory management
        # Fixed-port loopback twins must not contend with one another.
        run: OSPREY_TEST_JOBS=1 target/release/osprey test tests

      - name: Core language assertion corpus — GC
        run: OSPREY_TEST_JOBS=1 target/release/osprey test tests --memory=gc

      - name: Core language assertion corpus — ARC
        run: OSPREY_ARC_DEBUG=1 OSPREY_TEST_JOBS=1 target/release/osprey test tests --memory=arc

      # Dead-code gate: fail if any `pub` declaration is unreachable from the
      # osprey binary (hawk::dead_public). Scoped to dead_public only — see the
      # `hawk` target in the Makefile. cargo-hawk's prebuilt driver is pinned to
      # the stable toolchain this job installs (1.97.1); bump them together.
      - name: Install cargo-hawk (dead-code gate)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/latest/download/cargo-hawk-installer.sh | sh
      - name: Dead-code gate (hawk)
        run: make hawk

  # ─── WebAssembly target ─────────────────────────────────────────────────────
  # Compiles a sample Osprey program to wasm32-wasip1 with `osprey --target=wasm32`
  # and gates on the artifact being well-formed (`wasm-validate`) and producing
  # the expected stdout under a WASI host (Node's built-in `node:wasi`). Proves
  # the wasm runtime archive links and the emitted module actually runs.
  # Self-contained (no VS Code toolchain) so it stays fast. [WASM-TARGET]
  wasm:
    name: WebAssembly target (wasm32-wasip1)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang/LLVM, lld (wasm-ld), wabt and a WASI sysroot
        # clang's wasm32 backend lowers the IR; lld provides wasm-ld; wabt gives
        # wasm-validate; the wasi-sdk sysroot supplies wasm32-wasip1 libc + crt1.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld wabt zsh
          WASI_VERSION=24
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sysroot-${WASI_VERSION}.0.tar.gz"
          # The release tarball unpacks to a versioned top dir (wasi-sysroot-<v>.0/);
          # strip it so the sysroot lands at a stable path containing lib/wasm32-wasip1.
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
          wasm-ld --version

      - name: Build native + wasm runtime archives and the compiler
        run: |
          make _runtime
          make _runtime_wasm
          cargo build --release -p osprey-cli

      - name: Compile the example to wasm, validate, and smoke-run under WASI
        run: |
          mkdir -p examples/wasm/build
          target/release/osprey examples/wasm/hello.osp --target=wasm32 \
            --compile -o examples/wasm/build/hello.wasm
          wasm-validate examples/wasm/build/hello.wasm
          node scripts/wasm-smoke.mjs examples/wasm/build/hello.wasm examples/wasm/hello.expectedoutput
          node scripts/wasm-browser-smoke.mjs examples/wasm/build/hello.wasm examples/wasm/hello.expectedoutput

      - name: WebAssembly Data Studio suite (Default + ML)
        # Both source flavors compile to portable WASI modules and must produce
        # the same committed manifest under Node and the browser WASI shim.
        run: |
          target/release/osprey examples/wasm/studio.osp --target=wasm32 \
            --compile -o examples/wasm/build/studio.osp.wasm
          target/release/osprey examples/wasm/studio.ospml --target=wasm32 \
            --compile -o examples/wasm/build/studio.ospml.wasm
          wasm-validate examples/wasm/build/studio.osp.wasm
          wasm-validate examples/wasm/build/studio.ospml.wasm
          node scripts/wasm-smoke.mjs examples/wasm/build/studio.osp.wasm examples/wasm/studio.expectedoutput
          node scripts/wasm-browser-smoke.mjs examples/wasm/build/studio.osp.wasm examples/wasm/studio.expectedoutput
          node scripts/wasm-smoke.mjs examples/wasm/build/studio.ospml.wasm examples/wasm/studio.expectedoutput
          node scripts/wasm-browser-smoke.mjs examples/wasm/build/studio.ospml.wasm examples/wasm/studio.expectedoutput

      - name: WebAssembly differential — whole tests/ corpus vs the native goldens
        # The three steps above gate the wasm backend on three hand-picked
        # programs. This one runs EVERY program in tests/ that links on wasm32
        # and holds each to the byte-exact stdout the native backend produces.
        # The programs that may skip are pinned — name and symbol — in
        # tests/WASM_UNPORTABLE.txt, and the harness fails on any drift, so the
        # covered count lives in exactly one place instead of going stale here.
        # A backend that miscompiles arithmetic, strings, maps or pattern
        # matching outside hello/studio has nowhere else to be caught.
        #
        # CAVEAT: this `wasm` job is NOT a required status check (only `ci` is,
        # per ruleset 6154907), so a red result here does not block a merge —
        # the same arrangement the deleted harness had. The sysroot download and
        # wasm runtime build this would need in `ci` are now there anyway (the
        # coverage gate depends on them), so moving this corpus differential
        # into `ci` costs only its runtime — still a deliberate call, not a
        # silent one.
        run: OSPREY_TARGET=wasm32 zsh crates/run_test_corpus.sh

  # ─── Website end-to-end (Playwright) ────────────────────────────────────────
  # Builds the site (compiler-free; committed reference docs) and runs the
  # Playwright suite: every page template at three breakpoints (no JS errors,
  # no horizontal overflow, dark theme, chrome present, logo resolves) plus
  # nav / hero / mobile-menu / TOC interaction assertions.
  website:
    name: Website E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-website-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-website-wasm-

      - name: Install wasm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld wabt zsh
          WASI_VERSION=24
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sysroot-${WASI_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
          wasm-ld --version
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7
