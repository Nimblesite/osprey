# agent-pmo:74cf183
name: CI

# CI runs ONLY on PRs to main. Merging to main triggers nothing; releases are
# tag-triggered (release.yml). See docs/RELEASING.md.
#
# ─── Shape of this pipeline ─────────────────────────────────────────────────
# Four stages, and every test runs EXACTLY ONCE:
#
#   1. `build`  — every static check (format, clippy, extension lint,
#      duplication, dead code, manifest) plus every artifact the test stage
#      needs: the C runtime archives, the wasm runtime archive, the release
#      `osprey` binary and the compiled extension bundle.
#   2. Those artifacts are uploaded once and downloaded by each test job, so
#      Linux jobs reuse the build; iOS builds its own macOS compiler and SDK artifacts.
#   3. Every test suite runs in parallel, each collecting coverage where the
#      language has a coverage story (Rust via llvm-cov, C via gcov, the
#      extension via V8).
#   4. `coverage` gathers those reports and enforces the per-project
#      thresholds in coverage-thresholds.json, then runs the iOS platform gate.
#
# This replaced a pipeline that ran the language corpus SEVEN times per PR —
# `make test` ran it as TAP, again for goldens, and again under GC and ARC,
# while a separate `rust` job ran all three backends a second time — and ran
# the Rust suite twice over, once plain and once re-executed under llvm-cov.
# `crates/run_test_corpus.sh` already performs both observations in ONE pass
# (exit status AND byte-exact golden, see its header), so one invocation per
# memory backend is the whole matrix. Re-running a suite to collect coverage
# it could have collected the first time is the specific waste this shape
# exists to prevent: if a suite is worth running, it is worth running
# instrumented, once.
#
# ─── Required-check note ────────────────────────────────────────────────────
# Ruleset 6154907 requires one check, "All checks green" (the `all-green` job
# at the end). It waits for every other job here and every other workflow on
# the PR's head commit, and fails if any did not pass or skip, so every check
# on a branch gates its merge and adding a job never touches the ruleset.
# scripts/verify-branch-protection.mjs asserts that from inside the tree.
#
# Skipping a job via an `if:` condition reports its check as "skipped", which
# the gate treats as PASSING — so a website-only PR still merges. Do NOT give
# ci.yml an `on: paths:` filter: a workflow skipped by path filtering never
# runs the gate, leaving the required check pending forever.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 24 everywhere a wasm module is EXECUTED under `node:wasi`: that host caches
  # a module's memory backing store when the instance starts and never
  # refreshes it after `memory.grow`, so every later WASI call reads or writes
  # freed memory — on x86_64 a SIGSEGV inside node itself (exit 139, no stderr,
  # no wasm trap), or silently dropped output where the stale page is still
  # mapped. Node 24 is the first release that runs the assertion corpus clean.
  NODE_VERSION: "24"
  WASI_SDK_VERSION: "24"

jobs:
  # ─── Change detection ───────────────────────────────────────────────────────
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
      book: ${{ steps.filter.outputs.book }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-ci-scope
        id: filter

      - name: Change detection contracts
        run: node --test scripts/ci-scope.test.mjs scripts/all-checks-green.test.mjs

      - name: Install benchmark harness shell
        if: steps.filter.outputs.benchmarks == 'true' || steps.filter.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Benchmark publication contracts
        if: steps.filter.outputs.benchmarks == 'true' || steps.filter.outputs.code == 'true'
        run: python3 benchmarks/test_merge_results.py --tooling-only

      # Branch protection lives in GitHub's settings, not in this tree, so it
      # drifts silently — both rulesets were once found `enforcement: disabled`
      # with a 212-file PR already merged past them, and nothing in the repo
      # could have noticed. This step is the assertion that would have. It runs
      # HERE because `changes` is the one required job that never skips.
      - name: Branch protection intact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-branch-protection.mjs

  # ═══ STAGE 1 ════════════════════════════════════════════════════════════════
  # Every static check, and every artifact the test stage consumes. Nothing
  # here executes a test suite; Linux test jobs reuse this compiler artifact.
  build:
    name: Build, Format & Analyse
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # The site's images and videos are Git LFS files; the extension links
        # the shared profiler UI from the lspkit submodule.
        with:
          lfs: true
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            vscode-extension/package-lock.json
            webcompiler/package-lock.json
            website/package-lock.json
            examples/projects/modules/e2e/package-lock.json
            examples/projects/modules/web/package-lock.json

      # Skills live in .agents/skills for every agent; Claude Code reads them
      # through links in .claude/skills.
      - name: Every skill is linked for Claude Code
        run: node lspkit/scripts/link-skills.mjs --check .

      # Rust toolchain + clang/LLVM + lldb-dap + the C runtime archives + the
      # release binary.
      - name: Setup Osprey Compiler
        uses: ./.github/actions/setup-osprey-compiler

      - name: Build the shared profiler UI (lspkit submodule)
        run: make _profiler_ui

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: ./vscode-extension

      - name: Install jq and the wasm toolchain
        run: |
          set -euo pipefail
          sudo apt-get install -y jq lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          # The tarball unpacks to a versioned top dir; strip it so the sysroot
          # lands at a stable path containing lib/wasm32-wasip1.
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      - name: Build the shared Talon browser client
        run: |
          npm ci --prefix examples/projects/modules/web
          npm --prefix examples/projects/modules/web run build

      # ── Static analysis. All of it, before anything is tested. ──

      # A Make target that runs a node tool without depending on that
      # subproject's install stamp only fails on a machine that has never
      # installed it — never on a CI runner that installs everything up front,
      # and never on the author's machine. This asserts the prerequisite is
      # there. It is a step in an existing job, which the all-green gate
      # already waits for.
      - name: Make node dependency guard intact
        run: node scripts/verify-node-deps-guard.mjs

      # The release pipeline runs only on a tag, so nothing on a PR exercises
      # it. Every way it had of publishing nothing and reporting success was
      # therefore invisible until a release went out. This asserts those ways
      # stay closed, on the PR that would reopen one.
      - name: Release failure gates intact
        run: |
          node scripts/verify-release-gates.mjs
          python3 scripts/test-release-gate.py

      # `_lint` (scripts/make/tests.mk) also runs these three; the analysis job
      # re-implements the rest of that recipe inline. Without them a licence
      # bundle or dead-code regression cannot fail a merge.
      - name: Dead-code gate intact
        run: node scripts/verify-no-dead-code.mjs

      - name: Package licence bundles intact
        run: node scripts/verify-package-licenses.mjs

      - name: Package licence guard regressions
        run: node --test scripts/test-package-licenses.mjs

      - name: Package coverage wiring contracts
        run: |
          python3 scripts/test-package-coverage.py
          python3 scripts/test-package-coverage-projects.py

      - name: Python application runner contracts
        run: python3 scripts/test-python-app-ports-contracts.py

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Extension lint (tsc --noEmit)
        run: npm run lint
        working-directory: ./vscode-extension

      # [EDITOR-VERSIONING] Keep shipwright.json valid against the in-repo
      # Shipwright schema. Do not use @nimblesite/shipwright-validate-manifest:
      # published versions currently ship without their bundled schemas.
      - name: Validate deployment manifest
        run: npm run test:shipwright
        working-directory: ./vscode-extension

      # The local and hosted gates install the latest release and read the same
      # committed threshold. A failed download or breached ceiling fails CI.
      - name: Install latest Deslop
        run: bash scripts/install-deslop.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deslop duplication gate
        run: deslop . --nohtml --nojson --output "$RUNNER_TEMP/deslop-report" --log-to-console --log-level error --no-color

      # Dead-code gate: fail if any `pub` declaration is unreachable from the
      # osprey binary (hawk::dead_public). cargo-hawk's prebuilt driver runs
      # only under the exact rustc it was built for, so the Makefile pins the
      # hawk release and that toolchain together and runs hawk under it; a
      # stable release no longer breaks the gate.
      - name: Install cargo-hawk (dead-code gate)
        run: make hawk-install
      - name: Dead-code gate (hawk)
        run: make hawk

      # ── Artifacts for stage 3. ──
      - name: Build the extension bundle
        run: make _vsix_bundle

      - name: Package the VSIX
        run: make _vsix_package

      - name: Upload compiler artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osprey-build
          # The archives only — compiler/bin also holds ~12M of object files
          # and C test binaries, and the C suite rebuilds those instrumented
          # anyway. `_vsix_bundle` reads them from compiler/bin ($(RTB)); the
          # compiler itself resolves them via compiler/lib.
          path: |
            target/release/osprey
            target/osprey-pkg
            target/osprey-registry
            target/package-workspace.wasm
            target/workbench.wasm
            compiler/lib/
            compiler/bin/*.a
            examples/projects/modules/src/web/bundle.ospml
          retention-days: 7
          if-no-files-found: error

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osprey-extension
          path: |
            vscode-extension/out/
            vscode-extension/*.vsix
          retention-days: 7
          if-no-files-found: error

  # ═══ STAGE 3 ════════════════════════════════════════════════════════════════
  # Every suite, in parallel, each instrumented. None of these rebuilds the
  # compiler: they download stage 1's artifacts.

  # The Rust workspace, run ONCE under llvm-cov. There is no separate plain
  # `cargo test` run: an instrumented run asserts everything an uninstrumented
  # one does, so running both is pure duplication.
  test-rust:
    name: "Tests: Rust workspace (coverage)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      # osprey-cli's wasm end-to-end test self-skips unless wasm-ld, a WASI
      # sysroot and libosprey_runtime_wasm.a are all present; skipping it drops
      # osprey-cli under its coverage floor and fails the threshold gate. The
      # dependency is therefore explicit rather than left to whatever the
      # runner happens to carry.
      - name: Install the wasm toolchain
        run: |
          set -euo pipefail
          sudo apt-get install -y lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      - name: Install cargo-llvm-cov
        # `|| true` here hid a failed install behind a confusing `make
        # _test_rust` error several steps later. `cargo install` is already a
        # no-op when the binary is present, so it needs no help succeeding.
        run: cargo install cargo-llvm-cov --locked

      - name: Tests with coverage
        run: make _test_rust

      - name: Upload Rust coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: target/coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload test log on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-log-rust
          path: target/logs/rust-test.log
          if-no-files-found: ignore
          retention-days: 7

  # [PKG-COVERAGE-GATE] Each package has its own source threshold. Keep this
  # collection independent of the Rust workspace's existing time budget.
  test-packages:
    name: "Tests: package source coverage"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Package coverage collection
        run: make _test_packages
      - name: Upload package coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-packages
          path: target/coverage/packages/
          retention-days: 7
          if-no-files-found: error

  test-registry-gc:
    name: "Tests: package manager (gc)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey target/osprey-pkg
      - name: Install uv for Python integration
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: false
      - name: Require Python integration prerequisites
        run: |
          uv --version
          uv python install 3.12
      - name: Package manager security and integration suites
        run: make _test_registry REGISTRY_MEMORY=gc

  test-registry-arc:
    name: "Tests: package manager (arc)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey target/osprey-pkg
      - name: Install uv for Python integration
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: false
      - name: Require Python integration prerequisites
        run: |
          uv --version
          uv python install 3.12
      - name: Package manager security and integration suites
        run: make _test_registry REGISTRY_MEMORY=arc

  test-python-app-ports:
    name: "Tests: Python application ports"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Python application ports under every memory backend
        run: make _test_python_app_ports

  # The assertion corpus, once per memory backend. `run_test_corpus.sh` checks
  # BOTH the in-language assertions and the byte-exact stdout golden in a
  # single pass, and comparing one golden across every backend is the
  # [MEM-BACKENDS] [MEM-OPAQUE] oracle: swapping the allocator must not perturb
  # one byte of output.
  #
  # These are two explicit jobs rather than one matrix, so each backend reports
  # under its own literal name.
  test-corpus-gc:
    name: "Tests: language corpus (gc)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Corpus and goldens (GC)
        run: make _conformance-gc

  test-corpus-arc:
    name: "Tests: language corpus (arc)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Corpus and goldens (ARC, leak oracle enabled)
        run: make _conformance-arc

  # [PROOF-KERNEL] [PROOF-SPEED] The M0 proof kernel of plan 0041 and the Lean
  # head-to-head speed gate of spec 0049. `make _test_proof_kernel` holds
  # examples/proof/kernel to its byte-exact golden under GC, ARC and wasm32 —
  # hence the same staging test-wasm does: wasm-ld + a WASI sysroot, and the
  # wasm runtime archive rebuilt by `make _runtime_wasm`. Then
  # benchmarks/proof/run.sh checks the same theorem with both kernels and is
  # red unless Osprey's best wall time beats Lean's on the same runner. Lean
  # comes from elan with the toolchain pinned to an exact release — `stable`
  # floats, and a baseline that moves silently turns the comparison into
  # noise. The script exits 2 without lean or the binary, 1 when Osprey is
  # not faster, 0 when it is; every non-zero exit fails this job.
  # examples/proof/** classifies as code and benchmarks/proof/** as
  # benchmarks, so both gate this job the way the changes job gates its own
  # benchmark steps. `build` still runs only for code changes, so a
  # benchmarks-only PR stages no binary and this job is skipped with it.
  test-proof:
    name: "Tests: proof kernel and Lean speed gate"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-latest
    # A cold run installs a 2.3 GB toolchain and builds lean4export and
    # lean4checker from source before any test runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install lld (wasm-ld), wabt, zsh and a WASI sysroot
        run: |
          set -euo pipefail
          sudo apt-get install -y lld wabt zsh
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
          wasm-ld --version

      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      # The speed gate's baseline. The toolchain is the one
      # benchmarks/proof/tools/lean-toolchain pins, the same file the tools
      # cache key hashes, so a bumped pin is a new cache entry.
      - name: Install Lean (elan, pinned toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat benchmarks/proof/tools/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The Lean side of m1_export: lean4export and lean4checker, built from
      # source at the revs benchmarks/proof/tools/lake-manifest.json pins. The
      # build tree is restored by key and saved right after it is built, even
      # when a later step fails, so one cold build is never paid twice.
      - name: Restore the Lean proof tools
        id: proof-tools
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/proof/tools/.lake
          key: proof-tools-${{ runner.os }}-${{ hashFiles('benchmarks/proof/tools/lake-manifest.json', 'benchmarks/proof/tools/lean-toolchain', 'benchmarks/proof/tools/lakefile.toml') }}

      - name: Build the Lean proof tools
        run: cd benchmarks/proof/tools && lake build lean4export lean4checker IdImp

      - name: Save the Lean proof tools
        if: ${{ always() && steps.proof-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: benchmarks/proof/tools/.lake
          key: ${{ steps.proof-tools.outputs.cache-primary-key }}

      # The recorded fixture must be what the pinned exporter writes today.
      - name: Recorded Lean export reproduces byte for byte
        run: bash scripts/proof-export.sh --check

      - name: Recorded conjunction export reproduces byte for byte
        run: bash scripts/proof-export.sh --check --theorem and_swap

      - name: Recorded arithmetic export reproduces byte for byte
        run: bash scripts/proof-export.sh --check --theorem Nat.add_comm

      - name: Proof export recorder regressions
        run: node --test scripts/test-proof-export.mjs

      - name: OpenAI proof corpus trust ledger regressions
        run: python3 scripts/test-proof-openai.py

      - name: Recent OpenAI proof ports (Lean cross-check, GC, ARC and wasm32)
        run: python3 scripts/proof-openai.py --compiler target/release/osprey

      - name: Lean core proof corpus (Lean cross-check, GC, ARC and wasm32)
        run: python3 scripts/proof-openai.py --corpus lean-core --compiler target/release/osprey

      - name: Recorded Unicode proofs (fresh Lean, GC, ARC and wasm32)
        run: python3 scripts/test-proof-literals.py

      - name: M0 proof kernel (GC, ARC and wasm32 goldens)
        run: make _test_proof_kernel

      # The reference disciplines of spec 0050: Osprey checker packages built
      # by the compiler's own runner, round-tripped under GC, ARC and wasm32.
      - name: Reference disciplines (passthrough, bounded)
        run: make _test_disciplines

      # m0_identity is the regression gate; m1_export is the [PROOF-SPEED]
      # comparison: the Osprey reader and lean4checker re-check the same
      # recorded module. The script is red on any failed run.
      - name: Proof speed gate vs Lean
        run: zsh benchmarks/proof/run.sh

  test-c-runtime:
    name: "Tests: C runtime (coverage)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install jq
        run: sudo apt-get install -y jq

      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: C runtime suites with coverage
        run: make _test_c_runtime

      - name: Hunt mock runtime and corpus tooling assertions
        run: make _test_hunt_mock

      - name: C runtime coverage thresholds
        run: make _coverage_check_c_runtime

  # The COMPLETE extension suite — unit, integration and the debugger E2E
  # workflows that drive a real VS Code under xvfb and spawn lldb-dap per case.
  # It is slow because it is real; it is not sampled and it is not split.
  test-extension:
    name: "Tests: VS Code extension (coverage)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # The extension suite dominates every budget in this file: it drives a real
    # VS Code and spawns lldb-dap per debug-adapter case, which is minutes
    # slower on a runner than locally. 45 leaves headroom without hiding a
    # hang — a stuck run still fails, just later.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        # The extension links the shared profiler UI from the lspkit submodule.
        with:
          submodules: true
      # `pretest` compiles the extension, which copies its icon from this
      # LFS-stored logo; packaging also requires the README GIFs and the workbench
      # assets/lessons media it stages verbatim. Refuse pointers.
      - name: Fetch extension icon, README media and workbench assets
        run: git lfs install --local && git lfs pull --include="website/src/assets/images/logo.png,vscode-extension/media/package-tour.gif,vscode-extension/media/language-tour.gif,apps/workbench/assets/**,apps/workbench/lessons/media/**"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install jq and Xvfb
        run: sudo apt-get install -y jq xvfb

      # The package-workspace SDK host E2E tests compile fresh wasm32 fixtures
      # with the bundled compiler (compileSdkWasm), so this job needs the same
      # linker and sysroot the wasm job installs. The wasm runtime archive
      # itself arrives in the osprey-build artifact. Without this step eight
      # suites fail with "no WASI sysroot found".
      - name: Install the wasm toolchain
        run: |
          set -euo pipefail
          sudo apt-get install -y lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      # npm installs a packed copy of the built UI, so it is built first.
      - name: Build the shared profiler UI (lspkit submodule)
        run: make _profiler_ui

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: ./vscode-extension

      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      # Stage 1 already compiled the extension; restoring out/ lets `tsc -b`
      # no-op instead of rebuilding what has been built once.
      - uses: actions/download-artifact@v8
        with:
          name: osprey-extension
          path: vscode-extension/
      - name: Restore bundled extension assets
        run: |
          set -euo pipefail
          bundles=(vscode-extension/osprey-*.vsix)
          test "${#bundles[@]}" -eq 1
          bundle_dir=$(mktemp -d)
          trap 'rm -rf "$bundle_dir"' EXIT
          unzip -q "${bundles[0]}" 'extension/bin/*' -d "$bundle_dir"
          mkdir -p vscode-extension/bin
          cp -R "$bundle_dir/extension/bin/." vscode-extension/bin/
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey target/osprey-pkg target/osprey-registry vscode-extension/bin/linux-x64/osprey vscode-extension/bin/linux-x64/osprey-pkg vscode-extension/bin/linux-x64/osprey-registry

      - name: Extension suite with V8 coverage
        run: xvfb-run -a make _test_vscode_extension

      - name: Upload extension coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-extension
          path: vscode-extension/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Upload extension test log on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-log-extension
          path: vscode-extension/test.log
          if-no-files-found: ignore
          retention-days: 7

  # Compiles to wasm32-wasip1, gates on the artifact being well-formed
  # (`wasm-validate`) and producing the expected stdout under a WASI host, then
  # holds EVERY program in tests/ that links on wasm32 to the byte-exact stdout
  # the native backend produces. The programs that may skip are pinned — name
  # and symbol — in tests/WASM_UNPORTABLE.txt, and the harness fails on any
  # drift, so the covered count lives in exactly one place. [WASM-TARGET]
  test-wasm:
    name: "Tests: WebAssembly target (wasm32-wasip1)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install lld (wasm-ld), wabt and a WASI sysroot
        run: |
          set -euo pipefail
          sudo apt-get install -y lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
          wasm-ld --version

      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      - name: Compile, validate and smoke-run the examples
        run: |
          set -euo pipefail
          mkdir -p examples/wasm/build
          target/release/osprey examples/wasm/hello.osp --target=wasm32 \
            --compile -o examples/wasm/build/hello.wasm
          wasm-validate examples/wasm/build/hello.wasm
          node scripts/wasm-smoke.mjs examples/wasm/build/hello.wasm examples/wasm/hello.expectedoutput
          node scripts/wasm-browser-smoke.mjs examples/wasm/build/hello.wasm examples/wasm/hello.expectedoutput

      # Both source flavors compile to portable WASI modules and must produce
      # the same committed manifest under Node and the browser WASI shim.
      - name: WebAssembly Data Studio suite (Default + ML)
        run: |
          set -euo pipefail
          for flavor in osp ospml; do
            target/release/osprey "examples/wasm/studio.$flavor" --target=wasm32 \
              --compile -o "examples/wasm/build/studio.$flavor.wasm"
            wasm-validate "examples/wasm/build/studio.$flavor.wasm"
            node scripts/wasm-smoke.mjs "examples/wasm/build/studio.$flavor.wasm" examples/wasm/studio.expectedoutput
            node scripts/wasm-browser-smoke.mjs "examples/wasm/build/studio.$flavor.wasm" examples/wasm/studio.expectedoutput
          done

      - name: WebAssembly differential — whole tests/ corpus vs the native goldens
        run: make _test_wasm_goldens

  # Builds the site and runs the Playwright suite: every page template at three
  # breakpoints (no JS errors, no horizontal overflow, dark theme, chrome
  # present, logo resolves) plus nav / hero / mobile-menu / TOC assertions.
  # Deliberately depends on NOTHING. It is the one suite that is meaningful for
  # a website-only PR, so it must not be gated on `changes` — a job that
  # `needs:` a failed job is SKIPPED, and skipping every suite the moment the
  # gate-verification step trips would leave a PR with no test signal at all.
  test-website:
    name: "Tests: Website E2E (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # The site's images and videos are Git LFS files; the Book's examples
        # build the compiler, whose workspace resolves through lspkit.
        with:
          lfs: true
          submodules: true
      - uses: ./.github/actions/detect-ci-scope
        id: filter
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      # Building the compiler compiles lspkit's profiler, whose build.rs runs
      # typeDiagram; without it on PATH the cargo build fails before any test.
      - name: Install typeDiagram
        uses: ./.github/actions/typediagram

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-website-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-website-wasm-

      # Website tests execute native documentation examples as well as WASM.
      - name: Install native and wasm toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm lld wabt zsh libssl-dev pkg-config pandoc jq
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ./website

      - name: Run end-to-end tests
        run: npm test
        working-directory: ./website

      - name: Book structure and executable examples
        if: steps.filter.outputs.book == 'true' || steps.filter.outputs.code == 'true'
        run: |
          make -C Book check
          make -C Book check-examples

      - name: Benchmark compiler fixture
        if: steps.filter.outputs.benchmarks == 'true' || steps.filter.outputs.code == 'true'
        run: python3 -m unittest benchmarks.test_merge_results.LspFixtureTests

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

  # The showcases that exercise the compiler as a PRODUCT rather than a
  # library: the `osprey test` subcommand over the bank's native suites, a real
  # Chromium against the compiled binary serving its HTTP API, the profiler,
  # the containerised web compiler, and the shared mobile domain + Android host.
  test-integration:
    name: "Tests: integration (bank, profiler, web compiler)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: examples/projects/modules/e2e/package-lock.json

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - uses: actions/download-artifact@v8
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      # Exercises the `osprey test` subcommand itself — the one execution path
      # the corpus harness does not take, since it runs programs with `--run`.
      - name: Bank native tests (osprey test)
        run: make _bank_test

      - name: Profiler suite
        run: make _test_profiler

      - name: Shared mobile domain and build-tool regressions
        run: |
          python3 scripts/test-mobile-tools.py
          target/release/osprey examples/mobile/inbox/test --run
          target/release/osprey examples/projects/modules/mobile/app/test --run

      - name: Set up Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK but leaves cmdline-tools off
      # PATH, so a bare `sdkmanager` exits 127 and the whole Android gate never
      # runs. Resolve the newest installed cmdline-tools rather than assuming a
      # `latest/` symlink, and fail loudly when there is none: a gate that
      # cannot install its NDK must not report success.
      #
      # The emulator's system image is installed here, not left to the
      # emulator action: the action downloads it once with no retry, so one
      # truncated archive from the SDK mirror ("Error on ZipFile unknown
      # archive") failed the whole job. Each retry discards the partial
      # download, and the action then finds the image already installed.
      - name: Install Android build tools and enable emulator acceleration
        run: |
          set -euo pipefail
          sdk_root=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          sdk_tools="$sdk_root/cmdline-tools"
          [ -d "$sdk_tools" ] || { echo "::error::no cmdline-tools directory under $sdk_root"; exit 1; }
          sdkmanager=$(find "$sdk_tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          [ -x "$sdkmanager" ] || { echo "::error::no sdkmanager under $sdk_tools"; exit 1; }
          "$sdkmanager" "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0"
          image="system-images;android-34;google_apis;x86_64"
          image_dir="$sdk_root/system-images/android-34/google_apis/x86_64"
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "$image" --channel=0 > /dev/null && [ -f "$image_dir/system.img" ]; then
              break
            fi
            echo "::warning::system image download $attempt failed; retrying"
            rm -rf "$sdk_root/.temp" "$HOME/.android/cache" "$image_dir"
          done
          [ -f "$image_dir/system.img" ] || { echo "::error::could not install $image"; exit 1; }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android ABI, language goldens, app persistence and lint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            make android-test
            make bank-android-test
            examples/projects/modules/mobile/android/gradlew -p examples/projects/modules/mobile/android --console=plain :app:lintDebug
            cd examples/mobile/android && ./gradlew --console=plain :app:lintDebug

      - name: Native bank Android results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bank-android-results
          path: |
            examples/projects/modules/mobile/android/build/instrumentation.txt
            examples/projects/modules/mobile/android/build/screenshots/
            examples/projects/modules/mobile/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Install bank e2e dependencies
        run: npm ci
        working-directory: ./examples/projects/modules/e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./examples/projects/modules/e2e
      - name: Bank e2e (Playwright)
        run: npx playwright test
        working-directory: ./examples/projects/modules/e2e

      # The HTML documentation export is a shipped artifact with navigation,
      # search, themes and a mobile layout. Its unit tests assert what the
      # exporter writes; only a browser asserts what a reader gets — and every
      # defect this step has caught passed those unit tests first. It reuses the
      # Chromium and node_modules the bank e2e step above already installed.
      - name: Documentation HTML browser acceptance
        run: node scripts/verify-docs-html.mjs target/release/osprey

      - name: Upload bank e2e results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bank-e2e-results
          path: examples/projects/modules/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Web Compiler
        run: |
          set -euo pipefail
          cd webcompiler
          docker build -t osprey-web-compiler-ci -f Dockerfile ..
          docker run -d --name osprey-web-compiler-ci -p 3001:3001 \
            -e NODE_ENV=production -e PORT=3001 \
            --memory=256m --memory-reservation=256m \
            osprey-web-compiler-ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/api >/dev/null 2>&1 && break
            sleep 1
          done
          chmod +x test.sh && ./test.sh
          docker stop osprey-web-compiler-ci
          docker rm osprey-web-compiler-ci

  # ═══ STAGE 4 ════════════════════════════════════════════════════════════════
  # Thresholds are enforced HERE, against reports the test jobs produced, so no
  # suite is ever re-run to measure what it already measured. The C runtime
  # gate lives in its own job because gcov data never leaves that container.
  # This existing required context also gates the iOS device/simulator builds
  # and simulator tests. macos-15 is ARM64, matching the simulator archive.
  coverage:
    name: Coverage thresholds
    needs: [changes, test-rust, test-extension, test-packages, test-registry-gc, test-registry-arc]
    if: ${{ always() && needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Package manager suites passed
        run: |
          test "${{ needs.test-registry-gc.result }}" = "success"
          test "${{ needs.test-registry-arc.result }}" = "success"
      - uses: actions/checkout@v7
        # lsp-profiler is a path dependency in the lspkit submodule, and cargo
        # reads its manifest to resolve the workspace [PROF-LSP-RUNTIME].
        with:
          submodules: true
          lfs: true

      - name: Install jq
        run: command -v jq >/dev/null || brew install jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The iOS and macOS builds compile the workspace, whose lsp-profiler
      # build script generates its wire model with typeDiagram [PROF-LSP-RUNTIME].
      - name: Install typeDiagram
        uses: ./.github/actions/typediagram

      - uses: actions/download-artifact@v8
        with:
          name: coverage-rust
          path: target/coverage/
      - uses: actions/download-artifact@v8
        with:
          name: coverage-extension
          path: vscode-extension/coverage/
      - uses: actions/download-artifact@v8
        with:
          name: coverage-packages
          path: target/coverage/packages/

      - name: Rust per-crate thresholds
        run: make _coverage_check_rust

      - name: VS Code extension thresholds
        run: make _coverage_check_vscode_extension

      - name: Package thresholds
        run: make _coverage_check_packages

      - name: iOS and macOS builds, ABI, goldens and app persistence
        run: make ios-test macos-test mobile-ios-test bank-ios-test

      - name: Native Workbench host and rendering regressions
        env:
          OSPREY_BIN: ${{ github.workspace }}/target/release/osprey
        run: |
          bash apps/workbench/hosts/apple/run.sh --build
          swift test --package-path apps/workbench/hosts/apple

      # [SYMEX-CRASH-GATE] The KLEE engine gates (hunt expectations, planted
      # crashes, default budget, safe sweep) are intentionally NOT run in CI:
      # clean.osp cannot complete inside the pinned 64-byte/30s settings on
      # any backend (issues #306, #307). Verification is local — the hunt
      # targets live in scripts/make/tests.mk and stay red until issue #306
      # is fixed. The host-only mock oracle below stays (no KLEE involved).

      - name: Native bank simulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bank-ios-results
          path: examples/projects/modules/mobile/ios/build/**/*.xcresult
          if-no-files-found: ignore

      - name: Upload combined coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            target/coverage/lcov.info
            target/coverage/packages/
            vscode-extension/coverage/
          retention-days: 7

  # ═══ THE REQUIRED CHECK ═════════════════════════════════════════════════════
  # The only check the `main` ruleset requires. It needs nothing and always
  # runs, waits for every other job here and every other workflow run on the
  # PR's head commit, and fails if any did not pass or skip
  # (scripts/all-checks-green.mjs). A job or workflow added on a branch gates
  # that branch's merge with no list to update anywhere.
  all-green:
    name: All checks green
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Every other check passed or skipped
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_JOB: All checks green
        run: node scripts/all-checks-green.mjs
