# agent-pmo:74cf183
name: CI

# CI runs ONLY on PRs to main. Merging to main triggers nothing; releases are
# tag-triggered (release.yml). See docs/RELEASING.md.
#
# ─── Shape of this pipeline ─────────────────────────────────────────────────
# Four stages, and every test runs EXACTLY ONCE:
#
#   1. `build`  — every static check (format, clippy, extension lint,
#      duplication, dead code, manifest) plus every artifact the test stage
#      needs: the C runtime archives, the wasm runtime archive, the release
#      `osprey` binary and the compiled extension bundle.
#   2. Those artifacts are uploaded once and downloaded by each test job, so
#      Linux jobs reuse the build; iOS builds its own macOS compiler and SDK artifacts.
#   3. Every test suite runs in parallel, each collecting coverage where the
#      language has a coverage story (Rust via llvm-cov, C via gcov, the
#      extension via V8).
#   4. `coverage` gathers those reports and enforces the per-project
#      thresholds in coverage-thresholds.json, then runs the iOS platform gate.
#
# This replaced a pipeline that ran the language corpus SEVEN times per PR —
# `make test` ran it as TAP, again for goldens, and again under GC and ARC,
# while a separate `rust` job ran all three backends a second time — and ran
# the Rust suite twice over, once plain and once re-executed under llvm-cov.
# `crates/run_test_corpus.sh` already performs both observations in ONE pass
# (exit status AND byte-exact golden, see its header), so one invocation per
# memory backend is the whole matrix. Re-running a suite to collect coverage
# it could have collected the first time is the specific waste this shape
# exists to prevent: if a suite is worth running, it is worth running
# instrumented, once.
#
# ─── Required-check note ────────────────────────────────────────────────────
# Ruleset 6154907 pins the required checks by their DISPLAY NAME, and
# scripts/verify-branch-protection.mjs asserts that same list from inside the
# tree. The two must be changed together — the `changes` job fails until they
# agree, which is deliberate: a gate that drifts silently is the failure that
# script exists to catch.
#
# Skipping a job via an `if:` condition reports its check as "skipped", which
# branch protection treats as PASSING — so a website-only PR still merges. Do
# NOT convert any of these to an `on: paths:` filter: a workflow skipped by
# path filtering leaves the required check pending forever and blocks merges.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 24 everywhere a wasm module is EXECUTED under `node:wasi`: that host caches
  # a module's memory backing store when the instance starts and never
  # refreshes it after `memory.grow`, so every later WASI call reads or writes
  # freed memory — on x86_64 a SIGSEGV inside node itself (exit 139, no stderr,
  # no wasm trap), or silently dropped output where the stale page is still
  # mapped. Node 24 is the first release that runs the assertion corpus clean.
  NODE_VERSION: "24"
  WASI_SDK_VERSION: "24"

jobs:
  # ─── Change detection ───────────────────────────────────────────────────────
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
            code:
              - '!website/**'

      # Branch protection lives in GitHub's settings, not in this tree, so it
      # drifts silently — both rulesets were once found `enforcement: disabled`
      # with a 212-file PR already merged past them, and nothing in the repo
      # could have noticed. This step is the assertion that would have. It runs
      # HERE because `changes` is the one required job that never skips.
      - name: Branch protection intact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-branch-protection.mjs

  # ═══ STAGE 1 ════════════════════════════════════════════════════════════════
  # Every static check, and every artifact the test stage consumes. Nothing
  # here executes a test suite; Linux test jobs reuse this compiler artifact.
  build:
    name: Build, Format & Analyse
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            vscode-extension/package-lock.json
            webcompiler/package-lock.json
            website/package-lock.json
            examples/projects/modules/e2e/package-lock.json

      # Rust toolchain + clang/LLVM + lldb-dap + the C runtime archives + the
      # release binary.
      - name: Setup Osprey Compiler
        uses: ./.github/actions/setup-osprey-compiler

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: ./vscode-extension

      - name: Install jq and the wasm toolchain
        run: |
          set -euo pipefail
          sudo apt-get install -y jq lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          # The tarball unpacks to a versioned top dir; strip it so the sysroot
          # lands at a stable path containing lib/wasm32-wasip1.
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      # ── Static analysis. All of it, before anything is tested. ──

      # A Make target that runs a node tool without depending on that
      # subproject's install stamp only fails on a machine that has never
      # installed it — never on a CI runner that installs everything up front,
      # and never on the author's machine. This asserts the prerequisite is
      # there. It is a step in an already-required job, not a new required
      # check, so the pinned context list in verify-branch-protection.mjs and
      # the ruleset stay in agreement.
      - name: Make node dependency guard intact
        run: node scripts/verify-node-deps-guard.mjs

      # The release pipeline runs only on a tag, so nothing on a PR exercises
      # it. Every way it had of publishing nothing and reporting success was
      # therefore invisible until a release went out. This asserts those ways
      # stay closed, on the PR that would reopen one.
      - name: Release failure gates intact
        run: |
          node scripts/verify-release-gates.mjs
          python3 scripts/test-release-gate.py

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Extension lint (tsc --noEmit)
        run: npm run lint
        working-directory: ./vscode-extension

      # [EDITOR-VERSIONING] Keep shipwright.json valid against the in-repo
      # Shipwright schema. Do not use @nimblesite/shipwright-validate-manifest:
      # published versions currently ship without their bundled schemas.
      - name: Validate deployment manifest
        run: npm run test:shipwright
        working-directory: ./vscode-extension

      # Official duplication gate. deslop measures source text, so one
      # platform's verdict is every platform's and a second copy elsewhere
      # would only duplicate this. The committed .deslop.toml is the threshold
      # source (deslop exits 3 when over); reports stay ephemeral rather than
      # consuming Actions artifact storage. `version` is explicit because the
      # action is pinned to the immutable commit for v0.27.0 rather than its
      # mutable tag. Docs: https://deslop.live/docs/github-action/
      - name: Deslop duplication gate
        uses: Nimblesite/Deslop@f1915e6328165f23a4bd1c6cd4262a64dd7d9033 # v0.27.0
        with:
          version: "0.27.0"
          upload-artifact: "false"

      # Dead-code gate: fail if any `pub` declaration is unreachable from the
      # osprey binary (hawk::dead_public). cargo-hawk's prebuilt driver is
      # pinned to the stable toolchain this job installs; when stable moves,
      # hawk's own release must move with it or this gate fails on a toolchain
      # mismatch alone.
      - name: Install cargo-hawk (dead-code gate)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/latest/download/cargo-hawk-installer.sh | sh
      - name: Dead-code gate (hawk)
        run: make hawk

      # ── Artifacts for stage 3. ──
      - name: Build the extension bundle
        run: make _vsix_bundle

      - name: Package the VSIX
        run: make _vsix_package

      - name: Upload compiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osprey-build
          # The archives only — compiler/bin also holds ~12M of object files
          # and C test binaries, and the C suite rebuilds those instrumented
          # anyway. `_vsix_bundle` reads them from compiler/bin ($(RTB)); the
          # compiler itself resolves them via compiler/lib.
          path: |
            target/release/osprey
            compiler/lib/
            compiler/bin/*.a
          retention-days: 7
          if-no-files-found: error

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osprey-extension
          path: |
            vscode-extension/out/
            vscode-extension/*.vsix
          retention-days: 7
          if-no-files-found: error

  # ═══ STAGE 3 ════════════════════════════════════════════════════════════════
  # Every suite, in parallel, each instrumented. None of these rebuilds the
  # compiler: they download stage 1's artifacts.

  # The Rust workspace, run ONCE under llvm-cov. There is no separate plain
  # `cargo test` run: an instrumented run asserts everything an uninstrumented
  # one does, so running both is pure duplication.
  test-rust:
    name: "Tests: Rust workspace (coverage)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      # osprey-cli's wasm end-to-end test self-skips unless wasm-ld, a WASI
      # sysroot and libosprey_runtime_wasm.a are all present; skipping it drops
      # osprey-cli under its coverage floor and fails the threshold gate. The
      # dependency is therefore explicit rather than left to whatever the
      # runner happens to carry.
      - name: Install the wasm toolchain
        run: |
          set -euo pipefail
          sudo apt-get install -y lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      - name: Install cargo-llvm-cov
        # `|| true` here hid a failed install behind a confusing `make
        # _test_rust` error several steps later. `cargo install` is already a
        # no-op when the binary is present, so it needs no help succeeding.
        run: cargo install cargo-llvm-cov --locked

      - name: Tests with coverage
        run: make _test_rust

      - name: Upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: lcov.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload test log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-rust
          path: test.log
          if-no-files-found: ignore
          retention-days: 7

  # The assertion corpus, once per memory backend. `run_test_corpus.sh` checks
  # BOTH the in-language assertions and the byte-exact stdout golden in a
  # single pass, and comparing one golden across every backend is the
  # [MEM-BACKENDS] [MEM-OPAQUE] oracle: swapping the allocator must not perturb
  # one byte of output.
  #
  # These are three explicit jobs rather than one matrix ON PURPOSE. The gate
  # is verified from inside the tree by scripts/verify-branch-protection.mjs,
  # which matches each required context against a literal job `name:`. A matrix
  # name interpolates (`(${{ matrix.memory }})`) and so matches nothing, which
  # that script correctly reports as a check that can never report. A
  # verifiable gate is worth more here than three saved stanzas.
  test-corpus-default:
    name: "Tests: language corpus (default)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Corpus and goldens (compiler-default allocator)
        run: make _test_goldens

  test-corpus-gc:
    name: "Tests: language corpus (gc)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Corpus and goldens (GC)
        run: make _conformance-gc

  test-corpus-arc:
    name: "Tests: language corpus (arc)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"
      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey
      - name: Corpus and goldens (ARC, leak oracle enabled)
        run: make _conformance-arc

  test-c-runtime:
    name: "Tests: C runtime (coverage)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install jq
        run: sudo apt-get install -y jq

      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: C runtime suites with coverage
        run: make _test_c_runtime

      - name: C runtime coverage thresholds
        run: make _coverage_check_c_runtime

  # The COMPLETE extension suite — unit, integration and the debugger E2E
  # workflows that drive a real VS Code under xvfb and spawn lldb-dap per case.
  # It is slow because it is real; it is not sampled and it is not split.
  test-extension:
    name: "Tests: VS Code extension (coverage)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # The extension suite dominates every budget in this file: it drives a real
    # VS Code and spawns lldb-dap per debug-adapter case, which is minutes
    # slower on a runner than locally. 45 leaves headroom without hiding a
    # hang — a stuck run still fails, just later.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install jq and Xvfb
        run: sudo apt-get install -y jq xvfb

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: ./vscode-extension

      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      # Stage 1 already compiled the extension; restoring out/ lets `tsc -b`
      # no-op instead of rebuilding what has been built once.
      - uses: actions/download-artifact@v4
        with:
          name: osprey-extension
          path: vscode-extension/
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: Extension suite with V8 coverage
        run: xvfb-run -a make _test_vscode_extension

      - name: Upload extension coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-extension
          path: vscode-extension/coverage/
          retention-days: 7
          if-no-files-found: error

      - name: Upload extension test log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log-extension
          path: vscode-extension/test.log
          if-no-files-found: ignore
          retention-days: 7

  # Compiles to wasm32-wasip1, gates on the artifact being well-formed
  # (`wasm-validate`) and producing the expected stdout under a WASI host, then
  # holds EVERY program in tests/ that links on wasm32 to the byte-exact stdout
  # the native backend produces. The programs that may skip are pinned — name
  # and symbol — in tests/WASM_UNPORTABLE.txt, and the harness fails on any
  # drift, so the covered count lives in exactly one place. [WASM-TARGET]
  test-wasm:
    name: "Tests: WebAssembly target (wasm32-wasip1)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - name: Install lld (wasm-ld), wabt and a WASI sysroot
        run: |
          set -euo pipefail
          sudo apt-get install -y lld wabt
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
          wasm-ld --version

      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      - name: Build the wasm runtime archive
        run: make _runtime_wasm

      - name: Compile, validate and smoke-run the examples
        run: |
          set -euo pipefail
          mkdir -p examples/wasm/build
          target/release/osprey examples/wasm/hello.osp --target=wasm32 \
            --compile -o examples/wasm/build/hello.wasm
          wasm-validate examples/wasm/build/hello.wasm
          node scripts/wasm-smoke.mjs examples/wasm/build/hello.wasm examples/wasm/hello.expectedoutput
          node scripts/wasm-browser-smoke.mjs examples/wasm/build/hello.wasm examples/wasm/hello.expectedoutput

      # Both source flavors compile to portable WASI modules and must produce
      # the same committed manifest under Node and the browser WASI shim.
      - name: WebAssembly Data Studio suite (Default + ML)
        run: |
          set -euo pipefail
          for flavor in osp ospml; do
            target/release/osprey "examples/wasm/studio.$flavor" --target=wasm32 \
              --compile -o "examples/wasm/build/studio.$flavor.wasm"
            wasm-validate "examples/wasm/build/studio.$flavor.wasm"
            node scripts/wasm-smoke.mjs "examples/wasm/build/studio.$flavor.wasm" examples/wasm/studio.expectedoutput
            node scripts/wasm-browser-smoke.mjs "examples/wasm/build/studio.$flavor.wasm" examples/wasm/studio.expectedoutput
          done

      - name: WebAssembly differential — whole tests/ corpus vs the native goldens
        run: OSPREY_TARGET=wasm32 zsh crates/run_test_corpus.sh

  # Builds the site and runs the Playwright suite: every page template at three
  # breakpoints (no JS errors, no horizontal overflow, dark theme, chrome
  # present, logo resolves) plus nav / hero / mobile-menu / TOC assertions.
  # Deliberately depends on NOTHING. It is the one suite that is meaningful for
  # a website-only PR, so it must not be gated on `changes` — a job that
  # `needs:` a failed job is SKIPPED, and skipping every suite the moment the
  # gate-verification step trips would leave a PR with no test signal at all.
  test-website:
    name: "Tests: Website E2E (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-website-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-website-wasm-

      - name: Install the wasm toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm lld wabt zsh
          curl -fsSL -o /tmp/wasi-sysroot.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sysroot-${WASI_SDK_VERSION}.0.tar.gz"
          sudo mkdir -p /opt/wasi-sdk/share/wasi-sysroot
          sudo tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sdk/share/wasi-sysroot --strip-components=1
          test -d /opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1
          echo "OSPREY_WASI_SYSROOT=/opt/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ./website

      - name: Run end-to-end tests
        run: npm test
        working-directory: ./website

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7

  # The showcases that exercise the compiler as a PRODUCT rather than a
  # library: the `osprey test` subcommand over the bank's native suites, a real
  # Chromium against the compiled binary serving its HTTP API, the profiler,
  # the containerised web compiler, and the shared mobile domain + Android host.
  test-integration:
    name: "Tests: integration (bank, profiler, web compiler)"
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: examples/projects/modules/e2e/package-lock.json

      - name: Setup Osprey toolchain (no rebuild)
        uses: ./.github/actions/setup-osprey-compiler
        with:
          build: "false"

      - uses: actions/download-artifact@v4
        with:
          name: osprey-build
      - name: Restore artifact permissions
        run: chmod +x target/release/osprey

      # Exercises the `osprey test` subcommand itself — the one execution path
      # the corpus harness does not take, since it runs programs with `--run`.
      - name: Bank native tests (osprey test)
        run: make _bank_test

      - name: Profiler suite
        run: make _test_profiler

      - name: Shared mobile domain and build-tool regressions
        run: |
          python3 scripts/test-mobile-tools.py
          target/release/osprey examples/mobile/inbox/test --run

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK but leaves cmdline-tools off
      # PATH, so a bare `sdkmanager` exits 127 and the whole Android gate never
      # runs. Resolve the newest installed cmdline-tools rather than assuming a
      # `latest/` symlink, and fail loudly when there is none: a gate that
      # cannot install its NDK must not report success.
      - name: Install Android build tools and enable emulator acceleration
        run: |
          set -euo pipefail
          sdk_root=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}
          sdk_tools="$sdk_root/cmdline-tools"
          [ -d "$sdk_tools" ] || { echo "::error::no cmdline-tools directory under $sdk_root"; exit 1; }
          sdkmanager=$(find "$sdk_tools" -maxdepth 3 -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          [ -x "$sdkmanager" ] || { echo "::error::no sdkmanager under $sdk_tools"; exit 1; }
          "$sdkmanager" "ndk;28.2.13676358" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android ABI, language goldens, app persistence and lint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            make android-test
            cd examples/mobile/android && ./gradlew --console=plain :app:lintDebug

      - name: Install bank e2e dependencies
        run: npm ci
        working-directory: ./examples/projects/modules/e2e
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./examples/projects/modules/e2e
      - name: Bank e2e (Playwright)
        run: npx playwright test
        working-directory: ./examples/projects/modules/e2e

      - name: Upload bank e2e results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bank-e2e-results
          path: examples/projects/modules/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Web Compiler
        run: |
          set -euo pipefail
          cd webcompiler
          docker build -t osprey-web-compiler-ci -f Dockerfile ..
          docker run -d --name osprey-web-compiler-ci -p 3001:3001 \
            -e NODE_ENV=production -e PORT=3001 \
            --memory=256m --memory-reservation=256m \
            osprey-web-compiler-ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/api >/dev/null 2>&1 && break
            sleep 1
          done
          chmod +x test.sh && ./test.sh
          docker stop osprey-web-compiler-ci
          docker rm osprey-web-compiler-ci

  # ═══ STAGE 4 ════════════════════════════════════════════════════════════════
  # Thresholds are enforced HERE, against reports the test jobs produced, so no
  # suite is ever re-run to measure what it already measured. The C runtime
  # gate lives in its own job because gcov data never leaves that container.
  # This existing required context also gates the iOS device/simulator builds
  # and simulator tests. macos-15 is ARM64, matching the simulator archive.
  coverage:
    name: Coverage thresholds
    needs: [changes, test-rust, test-extension]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: command -v jq >/dev/null || brew install jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v4
        with:
          name: coverage-rust
      - uses: actions/download-artifact@v4
        with:
          name: coverage-extension
          path: vscode-extension/coverage/

      - name: Rust per-crate thresholds
        run: make _coverage_check_rust

      - name: VS Code extension thresholds
        run: make _coverage_check_vscode_extension

      - name: iOS device and simulator builds, ABI, goldens and app persistence
        run: make ios-test mobile-ios-test

      - name: Upload combined coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            vscode-extension/coverage/
          retention-days: 7
