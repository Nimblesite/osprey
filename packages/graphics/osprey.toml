[project]
name = "graphics"
source_roots = ["src"]
default_namespace = "ui"

[package]
name = "@osprey/graphics"
license = "MIT"
summary = "Core graphics primitives for Osprey: rectangles, discs, strips, sprites, lettering and paths in a scene's own units, with packed colours"
keywords = ["graphics", "scene", "primitives", "canvas", "ui"]

[modules]
allow_wildcard_imports = false
