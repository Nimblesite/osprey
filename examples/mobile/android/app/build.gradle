plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'org.ospreylang.issueinbox'
    compileSdk 34
    defaultConfig {
        applicationId 'org.ospreylang.issueinbox'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.jniLibs.srcDirs = [rootProject.file('build/generated/jniLibs')]
}
