[project]
name = "transformers"
source_roots = ["src"]
python_sources = ["src/math.py", "src/lists.py", "src/logits_process.py", "src/stopping_criteria.py", "src/generation.py", "src/qwen3_5_tensor.py", "src/qwen3_5_norm.py", "src/qwen3_5_rope.py", "src/qwen3_5_mlp.py", "src/qwen3_5_attention.py", "src/qwen3_5_model.py", "src/qwen3_5_tool_schema.py", "src/qwen3_5_tool_json_scan.py", "src/qwen3_5_tool_constrain.py", "src/qwen3_5_tool_parser.py"]
default_namespace = "transformers"

[package]
name = "@osprey/transformers"
license = "MIT AND Apache-2.0"
summary = "Hugging Face generation utilities: logits processors, warpers, sampling and stopping criteria"
keywords = ["generation", "logits", "python-flavor", "sampling", "transformers"]

[test-dependencies]
"@osprey/testing" = { epoch = 1, min_release = 1 }
