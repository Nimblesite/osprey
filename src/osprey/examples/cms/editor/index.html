<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{color:inherit}button,summary,label[for]{cursor:pointer}button{border:0}button:disabled{cursor:not-allowed;opacity:.45}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}::selection{background:var(--accent);color:var(--panel-solid)}
.app{height:100%;display:grid;grid-template:64px minmax(0,1fr)/280px minmax(360px,1fr) minmax(320px,.85fr)}.glass{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.sidebar{grid-row:1/3;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);z-index:20}.brand{height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--gradient);color:var(--panel-solid);font-weight:900;box-shadow:var(--glow)}.brand strong{letter-spacing:-.03em;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;background:transparent;transition:background 150ms,transform 150ms}.icon-btn:hover{background:var(--hover)}.icon-btn:active{transform:scale(.94)}#new{margin-left:auto;color:var(--accent);font-size:22px}
.sidebar-tools{padding:16px 16px 8px}.search-wrap{position:relative}.search-wrap span{position:absolute;left:12px;top:8px;color:var(--muted)}input,select{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:10px;transition:border-color 150ms,box-shadow 150ms}input:focus,select:focus{border-color:var(--accent)}#search{width:100%;padding:9px 12px 9px 34px;outline:0}kbd{font:10px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px}.search-wrap kbd{position:absolute;right:9px;top:10px}.section-label{padding:12px 20px 6px;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

.upload-card{margin:8px 12px 12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--raised)}.upload-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.upload-row strong{font-size:12px}#upload-folder{width:100%;padding:6px 8px;margin-bottom:8px;font-size:12px}.drop-zone{display:block;padding:14px 8px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:11px;transition:border-color 150ms,background 150ms,box-shadow 150ms}.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow)}.drop-zone b{display:block;color:var(--text);font-size:12px}#upload-input{position:absolute;width:1px;height:1px;opacity:0}.progress-wrap{margin-top:10px}#progress{width:100%;height:5px;display:block;border:0;border-radius:8px;overflow:hidden;background:var(--line);accent-color:var(--accent)}#progress::-webkit-progress-bar{background:var(--line)}#progress::-webkit-progress-value{background:var(--gradient);transition:width 150ms}#progress-label{display:block;text-align:right;color:var(--muted);font-size:10px;margin-top:4px}
.topbar{grid-column:2/4;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);z-index:10}.crumbs{min-width:0;display:flex;align-items:center;gap:7px;flex:1;color:var(--muted);font-size:12px}.crumbs strong{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save-state{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:11px;white-space:nowrap}.save-state::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success)}.save-state.unsaved::before{background:var(--warning)}.save-state.saving::before{background:var(--accent);animation:pulse 1s infinite}.chip{font:11px ui-monospace,monospace;background:var(--raised);border:1px solid var(--line);padding:4px 8px;border-radius:7px;color:var(--muted)}#menu{display:none}
.editor-pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}.editor-head{height:54px;display:flex;align-items:center;gap:4px;padding:8px 12px;overflow-x:auto}.toolbar{display:flex;gap:2px;flex:1}.tool{min-width:30px;height:30px;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:650;transition:background 150ms,color 150ms}.tool:hover{background:var(--hover);color:var(--text)}.action{padding:7px 11px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font-size:12px;font-weight:650;transition:transform 150ms,background 150ms}.action:hover{background:var(--hover)}.action:active{transform:translateY(1px)}.action.primary{background:var(--accent);border-color:var(--accent);color:var(--panel-solid)}#delete{color:var(--danger);margin-right:4px}.editor-wrap{position:relative;flex:1;min-height:0}#editor{resize:none;width:100%;height:100%;display:block;border:0;border-radius:0;outline:0;background:transparent;color:var(--text);padding:28px 32px 60px;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}#editor::placeholder{color:var(--faint)}.preview-pane{min-width:0;min-height:0;overflow:auto;background:var(--panel-solid)}.preview-label{position:sticky;top:0;z-index:2;padding:15px 28px 10px;background:var(--panel-solid);color:var(--faint);font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line)}#preview{max-width:70ch;margin:0 auto;padding:28px 32px 72px;font-size:15px;line-height:1.8;overflow-wrap:break-word}#preview h1,#preview h2,#preview h3{line-height:1.2;letter-spacing:-.035em;margin:1.4em 0 .6em}#preview h1{font-size:2.25em;margin-top:0}#preview h2{font-size:1.65em}#preview p{margin:0 0 1.2em}#preview a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}#preview img{display:block;max-width:100%;height:auto;border-radius:12px;box-shadow:var(--shadow);margin:24px 0}#preview code{font:.86em ui-monospace,monospace;background:var(--code);color:var(--accent-2);padding:2px 5px;border-radius:5px}#preview pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:18px;overflow:auto;line-height:1.6}#preview pre code{background:transparent;padding:0;color:var(--text)}#preview blockquote{margin:24px 0;padding:4px 20px;border-left:3px solid var(--accent);color:var(--muted);background:var(--accent-soft);border-radius:0 10px 10px 0}#preview li{margin:5px 0}
.empty{position:absolute;inset:54px 0 0;display:grid;place-content:center;text-align:center;padding:32px;background:var(--bg);z-index:3}.empty svg{width:150px;color:var(--faint);margin:auto}.empty h2{font-size:22px;letter-spacing:-.03em;margin:18px 0 6px}.empty p{color:var(--muted);margin:0}.media-view{height:100%;overflow:auto;display:grid;place-content:center;padding:32px}.media-view img,.media-view video{max-width:100%;max-height:65vh;border-radius:16px;box-shadow:var(--shadow)}.media-view audio{width:min(440px,100%)}.media-name{text-align:center;color:var(--muted);font:11px ui-monospace,monospace;margin-top:16px}.is-loading{color:transparent!important;background:var(--shimmer)!important;background-size:200% 100%!important;animation:shimmer 1.4s infinite}.tree-skeleton{height:30px;margin:7px;border-radius:7px;background:var(--shimmer);background-size:200% 100%;animation:shimmer 1.4s infinite}
#status{position:fixed;left:296px;bottom:16px;z-index:50;max-width:min(680px,calc(100% - 320px));padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-solid);box-shadow:var(--shadow);font-size:12px}#status:empty{display:none}#status.error{border-color:var(--danger);color:var(--danger)}.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:grid;gap:8px;width:min(360px,calc(100% - 40px))}.toast{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid);box-shadow:var(--shadow);animation:toast-in 150ms ease-out}.toast.error{border-color:var(--danger)}.toast span{flex:1}.toast button{background:transparent;color:var(--muted);padding:0}.scrim{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity 150ms;z-index:69}.scrim.open{opacity:.7;pointer-events:auto}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);z-index:70;background:var(--panel-solid);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform 150ms;padding:22px;overflow:auto}.drawer.open{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer h2{margin:0;font-size:18px}.commit-item{padding:16px 0;border-bottom:1px solid var(--line)}.commit-item code{font:11px ui-monospace,monospace;color:var(--accent)}.commit-item p{margin:5px 0;font-weight:600}.commit-item time{font-size:11px;color:var(--muted)}
dialog{color:var(--text);background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(760px,92vw);max-height:82vh;box-shadow:var(--shadow)}dialog::backdrop{background:var(--bg);opacity:.8}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:18px}.media-card{padding:8px;background:var(--raised);border:1px solid var(--line);border-radius:12px;text-align:left;transition:border-color 150ms,transform 150ms}.media-card:hover{border-color:var(--accent);transform:translateY(-2px)}.media-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--code)}.media-card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px;color:var(--muted);font-size:11px}
@keyframes shimmer{to{background-position:-200% 0}}@keyframes pulse{50%{opacity:.35}}@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:1050px){.app{grid-template-columns:240px minmax(340px,1fr) minmax(280px,.8fr)}.topbar{padding:0 10px}.chip{display:none}#editor,#preview{padding-left:22px;padding-right:22px}.tool{min-width:27px}#status{left:256px}}
@media(max-width:700px){body{overflow:auto}.app{height:auto;min-height:100%;display:block}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:transform 150ms;box-shadow:var(--shadow)}.sidebar.open{transform:none}.topbar{height:60px;position:sticky;top:0}.editor-pane{height:65vh;min-height:480px;border-right:0}.preview-pane{min-height:55vh;border-top:1px solid var(--line)}#menu{display:inline-grid}.save-state{font-size:0;padding:6px}.save-state::before{margin:0}.empty{position:absolute}.crumbs .root-crumb{display:none}#status{left:16px;bottom:16px;max-width:calc(100% - 32px)}.toasts{bottom:76px}.drawer{padding:18px}#editor{padding:20px}.preview-label{padding-left:20px}#preview{padding:24px 20px 50px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
<aside class="sidebar glass" id="sidebar" aria-label="Content navigation">
  <div class="brand"><div class="brand-mark" aria-hidden="true">G</div><div><strong>Content studio</strong><small>Git CMS</small></div><button class="icon-btn" id="new" title="New page" aria-label="New page">+</button></div>
  <div class="sidebar-tools"><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find content…" aria-label="Filter files"><kbd>⌘K</kbd></div></div>
  <div class="section-label">Content</div><nav id="tree" aria-label="Files"><div class="tree-skeleton"></div><div class="tree-skeleton"></div><div class="tree-skeleton"></div></nav>
  <div class="upload-card"><div class="upload-row"><strong>Add media</strong><span class="file-icon">↑</span></div><select id="upload-folder" aria-label="Upload destination"></select><label class="drop-zone" id="drop-zone" for="upload-input"><b>Drop files or browse</b>Images, video & audio</label><input id="upload-input" type="file" accept="image/*,video/*,audio/*" multiple><div class="progress-wrap" id="progress-wrap" hidden><progress id="progress" max="100" value="0" aria-label="Upload progress"></progress><span id="progress-label">0%</span></div></div>
</aside>
<header class="topbar glass"><button class="icon-btn" id="menu" aria-label="Toggle content tree" aria-expanded="false">☰</button><div class="crumbs" id="breadcrumbs"><span class="root-crumb">Workspace</span><span>/</span><strong>Select content</strong></div><span class="save-state" id="save-state">Saved</span><code class="chip" id="commit" hidden></code><button class="icon-btn" id="history" aria-label="Open history" aria-expanded="false" title="History">↺</button><button class="icon-btn" id="theme" aria-label="Switch theme" title="Switch theme">☀</button></header>
<main class="editor-pane">
  <div class="editor-head" id="editor-head" hidden><div class="toolbar" id="toolbar" aria-label="Markdown formatting"><button class="tool" data-action="bold" aria-label="Bold" title="Bold"><b>B</b></button><button class="tool" data-action="italic" aria-label="Italic" title="Italic"><i>I</i></button><button class="tool" data-action="heading" aria-label="Heading" title="Heading">H</button><button class="tool" data-action="link" aria-label="Insert link" title="Link">↗</button><button class="tool" data-action="image" aria-label="Insert image from media" title="Image from media">▧</button><button class="tool" data-action="list" aria-label="Bulleted list" title="List">≡</button><button class="tool" data-action="quote" aria-label="Blockquote" title="Quote">❝</button><button class="tool" data-action="code" aria-label="Code" title="Code">&lt;/&gt;</button></div><button class="action" id="delete" aria-label="Delete file">Delete</button><button class="action primary" id="save">Save</button></div>
  <div class="editor-wrap"><textarea id="editor" aria-label="Markdown editor" placeholder="Write your story…" spellcheck="true" hidden></textarea><div class="empty" id="empty"><svg viewBox="0 0 160 120" fill="none" aria-hidden="true"><rect x="27" y="12" width="106" height="92" rx="14" stroke="currentColor" stroke-width="2"/><path d="M46 39h68M46 55h48M46 71h58" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="88" r="22" fill="currentColor" opacity=".14"/><path d="m109 88 8 8 15-19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Pick a page to edit</h2><p>Your site’s content lives here. Choose a file to begin.</p></div><div class="media-view" id="media-view" hidden></div></div>
</main>
<section class="preview-pane" aria-label="Live preview"><div class="preview-label">Live preview</div><article id="preview"></article></section>
</div>
<div id="status" role="status" aria-live="polite"></div><div class="toasts" id="toasts" aria-live="polite"></div>
<div class="scrim" id="scrim"></div><aside class="drawer" id="history-panel" aria-label="Commit history" aria-hidden="true"><div class="drawer-head"><h2>Change history</h2><button class="icon-btn" id="close-history" aria-label="Close history">×</button></div><div id="history-list"></div></aside>
<dialog id="media" aria-labelledby="media-title"><div class="drawer-head"><h2 id="media-title">Choose an image</h2><button class="icon-btn" id="close-media" aria-label="Close media picker">×</button></div><div class="media-grid" id="media-grid"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={files:[],roots:[],current:null,original:'',dirty:false,sha:'',openId:0,mediaCache:{}};
const icons={markdown:'MD',image:'IMG',video:'VID',audio:'AUD',other:'FILE'};
function showStatus(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);$('status').setAttribute('aria-live',error?'assertive':'polite')}
function toast(message,error=false){const item=document.createElement('div');item.className=`toast${error?' error':''}`;const text=document.createElement('span');text.textContent=message;item.append(text);if(error){const close=document.createElement('button');close.textContent='×';close.ariaLabel='Dismiss error';close.onclick=()=>item.remove();item.append(close)}else setTimeout(()=>item.remove(),3500);$('toasts').append(item)}
function showError(message){showStatus(message,true);toast(message,true)}
async function api(url,options={}){try{const response=await fetch(url,options);if(response.ok)return response;const data=await response.json().catch(()=>({error:`Request failed (${response.status})`}));throw new Error(data.error||`Request failed (${response.status})`)}catch(error){error.reported=true;showError(error.message);throw error}}
function setSaveState(label,kind=''){ $('save-state').textContent=label;$('save-state').className=`save-state ${kind}` }
function setCommit(sha){state.sha=sha||'';$('commit').hidden=!sha;$('commit').textContent=sha?`# ${sha.slice(0,7)}`:'';$('commit').title=sha||''}
function escapeHtml(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function safeUrl(url,image=false){if(image&&/^data:image\/(?:png|gif|jpe?g|webp|avif|svg\+xml);base64,/i.test(url))return url;if(/^(?:https?:|mailto:|#|\/|\.{1,2}\/)/i.test(url)||!/^[a-z][a-z\d+.-]*:/i.test(url))return url;return '#'}
function emphasis(text){return text.replace(/\*\*([^*\n]+)\*\*|__([^_\n]+)__/g,(_,a,b)=>`<strong>${a||b}</strong>`).replace(/\*([^*\n]+)\*|_([^_\n]+)_/g,(_,a,b)=>`<em>${a||b}</em>`)}
function stash(html,tokens){tokens.push(html);return `\u0000${tokens.length-1}\u0000`}
function inline(value){const tokens=[];let text=escapeHtml(value);text=text.replace(/`([^`\n]+)`/g,(_,code)=>stash(`<code>${code}</code>`,tokens));text=text.replace(/!\[([^\]]*)\]\(([^\s)]+)\)/g,(_,alt,url)=>stash(`<img src="${safeUrl(state.mediaCache[url]||url,true)}" alt="${alt}" loading="lazy">`,tokens));text=text.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g,(_,label,url)=>stash(`<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${emphasis(label)}</a>`,tokens));text=emphasis(text);return text.replace(/\u0000(\d+)\u0000/g,(_,index)=>tokens[index])}
function isBlock(line){return /^(?:#{1,6}\s|```|>\s?|[-*+]\s+|\d+\.\s+)/.test(line)}
function codeBlock(lines,start){const language=lines[start].slice(3).trim().replace(/[^\w-]/g,'');let i=start+1;const code=[];while(i<lines.length&&!lines[i].startsWith('```'))code.push(lines[i++]);return {html:`<pre><code${language?` class="language-${language}"`:''}>${escapeHtml(code.join('\n'))}\n</code></pre>`,next:Math.min(i+1,lines.length)}}
function listBlock(lines,start){const ordered=/^\d+\.\s+/.test(lines[start]);const pattern=ordered?/^\d+\.\s+/:/^[-*+]\s+/;let i=start;const items=[];while(i<lines.length&&pattern.test(lines[i]))items.push(`<li>${inline(lines[i++].replace(pattern,''))}</li>`);return {html:`<${ordered?'ol':'ul'}>${items.join('')}</${ordered?'ol':'ul'}>`,next:i}}
function quoteBlock(lines,start){let i=start;const quote=[];while(i<lines.length&&/^>\s?/.test(lines[i]))quote.push(lines[i++].replace(/^>\s?/,''));return {html:`<blockquote>${renderMarkdown(quote.join('\n'))}</blockquote>`,next:i}}
function paragraphBlock(lines,start){const paragraph=[lines[start]];let i=start+1;while(i<lines.length&&lines[i].trim()&&!isBlock(lines[i]))paragraph.push(lines[i++]);return {html:`<p>${inline(paragraph.join('\n')).replace(/\n/g,'<br>')}</p>`,next:i}}
function renderMarkdown(source){const lines=source.replace(/\r\n?/g,'\n').split('\n');let html='',i=0;while(i<lines.length){if(!lines[i].trim()){i++;continue}let block;const heading=lines[i].match(/^(#{1,6})\s+(.+)/);if(heading){html+=`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`;i++;continue}if(lines[i].startsWith('```'))block=codeBlock(lines,i);else if(/^>\s?/.test(lines[i]))block=quoteBlock(lines,i);else if(/^(?:[-*+]\s+|\d+\.\s+)/.test(lines[i]))block=listBlock(lines,i);else block=paragraphBlock(lines,i);html+=block.html;i=block.next}return html}
function makeTree(files){const root={folders:{},files:[]};for(const file of files){const parts=file.path.split('/');let node=root;for(const part of parts.slice(0,-1))node=node.folders[part]||=( {folders:{},files:[]} );node.files.push({...file,name:parts.at(-1)})}return root}
function fileButton(file){const button=document.createElement('button');button.className=`file${state.current?.path===file.path?' active':''}`;button.dataset.path=file.path;const icon=document.createElement('span');icon.className='file-icon';icon.textContent=icons[file.kind]||icons.other;const name=document.createElement('span');name.className='file-name';name.textContent=file.name;button.title=file.path;button.append(icon,name);return button}
function renderNode(node,container){for(const [name,child] of Object.entries(node.folders).sort()){const details=document.createElement('details');details.open=true;const summary=document.createElement('summary');summary.textContent=name;details.append(summary);const children=document.createElement('div');children.className='folder-children';renderNode(child,children);details.append(children);container.append(details)}for(const file of node.files.sort((a,b)=>a.name.localeCompare(b.name)))container.append(fileButton(file))}
function renderTree(){const query=$('search').value.trim().toLowerCase();const files=state.files.filter(file=>file.path.toLowerCase().includes(query));$('tree').replaceChildren();if(!files.length){const empty=document.createElement('p');empty.className='tree-empty';empty.textContent=query?'No matching content':'No content yet';$('tree').append(empty);return}renderNode(makeTree(files),$('tree'))}
function populateFolders(){const previous=$('upload-folder').value;const folders=new Set(state.roots);for(const file of state.files){const parts=file.path.split('/').slice(0,-1);parts.forEach((_,index)=>folders.add(parts.slice(0,index+1).join('/')))}$('upload-folder').replaceChildren();for(const folder of [...folders].sort()){const option=document.createElement('option');option.value=option.textContent=folder;$('upload-folder').append(option)}if(folders.has(previous))$('upload-folder').value=previous}
async function loadTree(){const data=await (await api('/api/tree')).json();state.files=data.files||[];state.roots=data.roots||[];populateFolders();renderTree()}
function updateCrumbs(path){$('breadcrumbs').replaceChildren();const root=document.createElement('span');root.className='root-crumb';root.textContent='Workspace';$('breadcrumbs').append(root);for(const part of path?path.split('/'):['Select content']){$('breadcrumbs').append(document.createTextNode(' / '));const name=document.createElement(part===path?.split('/').at(-1)?'strong':'span');name.textContent=part;$('breadcrumbs').append(name)}}
function resetOpen(){state.current=null;state.original='';state.dirty=false;$('editor').hidden=$('editor-head').hidden=$('media-view').hidden=true;$('empty').hidden=false;$('preview').replaceChildren();updateCrumbs('');setCommit('');setSaveState('Saved');renderTree()}
function prepareOpen(file){const markdown=file.kind==='markdown';state.current=file;state.dirty=false;updateCrumbs(file.path);$('empty').hidden=true;$('editor').hidden=!markdown;$('editor-head').hidden=false;$('toolbar').hidden=$('save').hidden=!markdown;$('media-view').hidden=markdown;$('preview').replaceChildren();setCommit('');setSaveState(markdown?'Saved':'Media');renderTree()}
async function showMedia(file,id){const view=$('media-view');view.replaceChildren();view.classList.add('is-loading');if(file.kind==='other'){view.classList.remove('is-loading');view.textContent='This file type can be deleted, but not previewed.';return}const response=await api(`/api/media?path=${encodeURIComponent(file.path)}`);const base64=(await response.text()).trim();if(id!==state.openId)return;state.mediaCache[file.path]=`data:${mime(file.path)};base64,${base64}`;view.classList.remove('is-loading');const element=document.createElement(file.kind==='image'?'img':file.kind);element.src=state.mediaCache[file.path];if(file.kind==='image')element.alt=file.path.split('/').at(-1);else element.controls=true;view.append(element);const name=document.createElement('div');name.className='media-name';name.textContent=file.path;view.append(name)}
function mime(path){const ext=path.split('.').at(-1).toLowerCase();return {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',avif:'image/avif',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4',flac:'audio/flac'}[ext]||'application/octet-stream'}
async function openFile(file){if(state.dirty&&!confirm('Discard unsaved changes?'))return;const id=++state.openId;prepareOpen(file);try{if(file.kind==='markdown'){$('editor').classList.add('is-loading');const response=await api(`/api/file?path=${encodeURIComponent(file.path)}`);const text=await response.text();if(id!==state.openId)return;$('editor').classList.remove('is-loading');$('editor').value=state.original=text;$('preview').innerHTML=renderMarkdown(text)}else await showMedia(file,id)}catch{$('editor').classList.remove('is-loading');$('media-view').classList.remove('is-loading')}}
function markDirty(){state.dirty=$('editor').value!==state.original;setSaveState(state.dirty?'Unsaved':'Saved',state.dirty?'unsaved':'');$('preview').innerHTML=renderMarkdown($('editor').value)}
function acceptCommit(data,verb){setCommit(data.commit);if(data.push)showError(`Committed locally; push failed: ${data.push}`);else{showStatus(`${verb} ${data.path}`);toast(`${verb} · ${data.commit.slice(0,7)}`)}}
async function save(){if(state.current?.kind!=='markdown')return;const path=state.current.path,body=$('editor').value;setSaveState('Saving…','saving');showStatus('Saving changes…');try{const response=await api(`/api/file?path=${encodeURIComponent(path)}`,{method:'PUT',headers:{'Content-Type':'text/plain; charset=utf-8'},body});const data=await response.json();if(state.current?.path===path){state.original=body;state.dirty=$('editor').value!==body;setSaveState(state.dirty?'Unsaved':'Saved',state.dirty?'unsaved':'')}acceptCommit(data,'Saved')}catch{if(state.current?.path===path)setSaveState('Unsaved','unsaved')}}
async function newPage(){if(state.dirty&&!confirm('Discard unsaved changes?'))return;const root=state.roots.includes('content')?'content':state.roots[0];const path=prompt('New page path (must end in .md):',`${root||'content'}/untitled.md`);if(!path)return;if(!state.roots.includes(path.split('/')[0])||!path.endsWith('.md')){showError('Choose a path under an allowed root ending in .md.');return}const title=path.split('/').at(-1).replace(/\.md$/,'').replace(/[-_]/g,' ');try{const response=await api(`/api/file?path=${encodeURIComponent(path)}`,{method:'PUT',headers:{'Content-Type':'text/plain; charset=utf-8'},body:`# ${title}\n\nStart writing…\n`});const data=await response.json();state.dirty=false;acceptCommit(data,'Created');await loadTree();await openFile(state.files.find(file=>file.path===path))}catch{}}
async function deleteFile(){if(!state.current)return;const path=state.current.path;if(!confirm(`Delete ${path}? This creates a git commit.`))return;try{const response=await api(`/api/file?path=${encodeURIComponent(path)}`,{method:'DELETE'});const data=await response.json();acceptCommit(data,'Deleted');resetOpen();setCommit(data.commit);await loadTree()}catch{}}
function replaceSelection(before,after='',placeholder='Text'){const editor=$('editor');const start=editor.selectionStart,end=editor.selectionEnd;const selected=editor.value.slice(start,end)||placeholder;editor.setRangeText(before+selected+after,start,end,'end');editor.focus();editor.setSelectionRange(start+before.length,start+before.length+selected.length);markDirty()}
function format(action){const selected=$('editor').value.slice($('editor').selectionStart,$('editor').selectionEnd);if(action==='image'){openMediaPicker().catch(()=>{});return}if(action==='bold')replaceSelection('**','**','Bold text');if(action==='italic')replaceSelection('*','*','Italic text');if(action==='heading')replaceSelection('## ','','Heading');if(action==='link')replaceSelection('[',`](https://example.com)`,'Link text');if(action==='list')replaceSelection((selected||'List item').split('\n').map(line=>`- ${line}`).join('\n'),'','');if(action==='quote')replaceSelection('> ','','Quote');if(action==='code')replaceSelection(selected.includes('\n')?'```\n':'`',selected.includes('\n')?'\n```':'`','code')}
function insertMedia(path){replaceSelection('![',`](${path})`,'Image description');$('media').close()}
async function addMediaCard(file){const card=document.createElement('button');card.className='media-card';card.dataset.path=file.path;const label=document.createElement('span');label.textContent=file.path;card.append(label);$('media-grid').append(card);const response=await api(`/api/media?path=${encodeURIComponent(file.path)}`);const data=(await response.text()).trim();state.mediaCache[file.path]=`data:${mime(file.path)};base64,${data}`;const image=document.createElement('img');image.src=state.mediaCache[file.path];image.alt='';card.prepend(image)}
async function openMediaPicker(){$('media-grid').replaceChildren();$('media').showModal();const images=state.files.filter(file=>file.kind==='image');if(!images.length){$('media').close();showStatus('Upload an image first, then insert it here.');return}for(const image of images)await addMediaCard(image)}
async function loadHistory(){const list=$('history-list');list.innerHTML='<div class="tree-skeleton"></div>';const data=await (await api('/api/history')).json();list.replaceChildren();for(const commit of data.commits||[]){const item=document.createElement('article');item.className='commit-item';const sha=document.createElement('code');sha.textContent=commit.sha.slice(0,8);const subject=document.createElement('p');subject.textContent=commit.subject;const date=document.createElement('time');date.textContent=new Date(commit.date).toLocaleString();item.append(sha,subject,date);list.append(item)}}
function toggleHistory(open){$('history-panel').classList.toggle('open',open);$('scrim').classList.toggle('open',open);$('history-panel').setAttribute('aria-hidden',String(!open));$('history').setAttribute('aria-expanded',String(open));if(open)loadHistory().catch(()=>{})}
function toggleSidebar(open){$('sidebar').classList.toggle('open',open);$('scrim').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open))}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;$('theme').textContent=next==='dark'?'☀':'☾';try{localStorage.setItem('cms-theme',next)}catch{}}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]||'');reader.onerror=()=>reject(new Error(`Could not read ${file.name}`));reader.readAsDataURL(file)})}
function safeFilename(name){const clean=name.toLowerCase().replace(/[^a-z0-9._-]/g,'-').replace(/^\.+/,'');return clean||'upload'}
async function uploadOne(file){const base64=await readFile(file);const parts=Math.max(1,Math.ceil(base64.length/786432));const path=`${$('upload-folder').value}/${safeFilename(file.name)}`;for(let part=0;part<parts;part++){const body=base64.slice(part*786432,(part+1)*786432);const url=`/api/upload?path=${encodeURIComponent(path)}&part=${encodeURIComponent(part)}&parts=${encodeURIComponent(parts)}`;const response=await api(url,{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body});const data=await response.json();const percent=Math.round((part+1)/parts*100);$('progress').value=percent;$('progress-label').textContent=`${file.name} · ${percent}%`;if(data.commit)acceptCommit(data,'Uploaded')}}
async function uploadFiles(files){if(!files.length)return;$('progress-wrap').hidden=false;$('upload-input').disabled=true;try{for(const file of files){$('progress').value=0;await uploadOne(file)}await loadTree();if(!$('status').classList.contains('error'))showStatus('Upload complete')}catch(error){if(!error.reported)showError(error.message)}finally{$('upload-input').disabled=false;$('upload-input').value='';setTimeout(()=>{$('progress-wrap').hidden=true},2500)}}
$('tree').addEventListener('click',event=>{const button=event.target.closest('.file');if(!button)return;const file=state.files.find(item=>item.path===button.dataset.path);if(file)openFile(file).catch(()=>{});if(innerWidth<700)toggleSidebar(false)});
$('editor').addEventListener('input',markDirty);$('search').addEventListener('input',renderTree);$('save').addEventListener('click',()=>save());$('new').addEventListener('click',()=>newPage());$('delete').addEventListener('click',()=>deleteFile());$('theme').addEventListener('click',toggleTheme);$('history').addEventListener('click',()=>toggleHistory(true));$('close-history').addEventListener('click',()=>toggleHistory(false));$('scrim').addEventListener('click',()=>{toggleHistory(false);toggleSidebar(false)});$('menu').addEventListener('click',()=>toggleSidebar(!$('sidebar').classList.contains('open')));
$('toolbar').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button)format(button.dataset.action)});$('media-grid').addEventListener('click',event=>{const card=event.target.closest('[data-path]');if(card)insertMedia(card.dataset.path)});$('close-media').addEventListener('click',()=>$('media').close());$('upload-input').addEventListener('change',event=>uploadFiles([...event.target.files]));
for(const type of ['dragenter','dragover'])$('drop-zone').addEventListener(type,event=>{event.preventDefault();$('drop-zone').classList.add('drag-over')});for(const type of ['dragleave','drop'])$('drop-zone').addEventListener(type,event=>{event.preventDefault();$('drop-zone').classList.remove('drag-over')});$('drop-zone').addEventListener('drop',event=>uploadFiles([...event.dataTransfer.files]));
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(innerWidth<700)toggleSidebar(true);$('search').focus()}if(event.key==='Escape'){toggleHistory(false);toggleSidebar(false)}});
$('theme').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾';resetOpen();loadTree().catch(()=>{});
</script>
</body>
