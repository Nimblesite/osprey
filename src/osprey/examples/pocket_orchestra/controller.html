<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d20">
<title>Light Orchestra · Ribbon</title>
<style>
:root{color-scheme:dark;font:18px system-ui;background:#080d20;color:#e9f6ff}*{box-sizing:border-box}body{margin:0;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));height:100dvh;display:flex;flex-direction:column;gap:14px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(22px,5vw,38px);margin:0}p{margin:0;color:#9fb4cc;line-height:1.5}button,input{font:inherit;padding:10px 16px;border:1px solid #64809a;border-radius:10px;background:#17253f;color:inherit}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #6de5ff;outline-offset:3px}button:disabled{opacity:.4}#pad{width:100%;flex:1;min-height:160px;border:1px solid #28445e;border-radius:24px;touch-action:none;background:#090f27}#status{font-size:15px}footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:flex;align-items:center;gap:10px}input{width:150px}.hint{font-size:14px}
</style>
<header><div><h1>Light Orchestra</h1><p>Pentatonic ribbon</p></div><button id="join">Join session</button></header>
<p id="status" role="status" aria-live="polite">Ready to connect to the desktop.</p>
<canvas id="pad" tabindex="0" role="application" aria-label="Musical ribbon. Touch to play; move right for higher notes, up for louder notes. Keyboard: hold space to play, arrows change pitch and loudness."></canvas>
<footer><button id="release" disabled>Release my notes</button><label>Keyboard pitch <input id="pitch" type="range" min="0" max="1" step="0.01" value="0.5"></label></footer>
<p class="hint">Touch with several fingers. Right = higher · Up = louder. Sound plays on the desktop. Trusted local network only.</p>
<script>
'use strict';
const pad=document.querySelector('#pad'),ctx=pad.getContext('2d'),status=document.querySelector('#status'),join=document.querySelector('#join'),release=document.querySelector('#release'),pitch=document.querySelector('#pitch');
const token=location.hash.slice(1)||sessionStorage.getItem('orchestraToken')||'';if(token)sessionStorage.setItem('orchestraToken',token);history.replaceState(null,'',location.pathname);
let socket=null,ready=false,sequence=0,heartbeat=null,keys=false,level=.65;
const fingers=new Map(),points=new Map();
function report(message){status.textContent=message}
function send(message){if(socket?.readyState===WebSocket.OPEN&&socket.bufferedAmount<16384){socket.send(JSON.stringify(message));return true}disconnect('Connection congested. Rejoin to continue.');return false}
function event(phase,finger,x,y){if(ready)send({type:'touch',sequence:++sequence,phase,finger,x,y})}
function disconnect(message){ready=false;clearInterval(heartbeat);fingers.clear();points.clear();keys=false;release.disabled=true;join.disabled=false;socket?.close();socket=null;report(message);draw()}
function connect(){if(!token){report('Open the complete invite link printed by the desktop server.');return}join.disabled=true;report('Connecting…');sequence=0;const ws=new WebSocket(`ws://${location.hostname}:${Number(location.port||80)+1}`,'orchestra.v1');socket=ws;
ws.onopen=()=>{if(socket===ws)send({type:'join',token})};
ws.onmessage=e=>{if(socket!==ws)return;try{const m=JSON.parse(e.data);if(m.type==='joined'){ready=true;release.disabled=false;report('Connected · touch the ribbon to play');heartbeat=setInterval(()=>send({type:'heartbeat'}),400)}else if(m.type==='silenced'){points.clear();fingers.clear();keys=false;draw();report('Conductor released all notes · touch again to play')}else if(m.type==='error'){disconnect(m.message)}else if(m.type==='ack'&&!m.accepted){disconnect('Session expired or event rejected. Rejoin to continue.')}}catch{disconnect('Invalid server response')}};
ws.onerror=()=>{if(socket===ws)disconnect('Cannot reach the desktop. Check the invite and Wi-Fi.')};ws.onclose=()=>{if(socket===ws)disconnect('Disconnected · all your notes have been released.')};}
function position(e){const r=pad.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
function draw(){const ratio=devicePixelRatio||1,r=pad.getBoundingClientRect();pad.width=Math.round(r.width*ratio);pad.height=Math.round(r.height*ratio);ctx.scale(ratio,ratio);ctx.clearRect(0,0,r.width,r.height);for(let i=0;i<15;i++){ctx.strokeStyle='#213453';ctx.beginPath();ctx.moveTo(i*r.width/14,0);ctx.lineTo(i*r.width/14,r.height);ctx.stroke()}for(const [id,p]of points){const x=p.x*r.width,y=(1-p.y)*r.height,g=ctx.createRadialGradient(x,y,2,x,y,100);g.addColorStop(0,'#9afff0');g.addColorStop(.3,'#23cce088');g.addColorStop(1,'#20a0ff00');ctx.fillStyle=g;ctx.fillRect(x-100,y-100,200,200);ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}}
pad.onpointerdown=e=>{if(!ready||fingers.size>=9)return;e.preventDefault();let id=0;while([...fingers.values()].includes(id))id++;fingers.set(e.pointerId,id);pad.setPointerCapture(e.pointerId);const p=position(e);points.set(id,p);event(0,id,p.x,p.y);draw()};
pad.onpointermove=e=>{const id=fingers.get(e.pointerId);if(id===undefined)return;const p=position(e);points.set(id,p);event(1,id,p.x,p.y);draw()};
function end(e){const id=fingers.get(e.pointerId);if(id===undefined)return;const p=points.get(id);event(2,id,p.x,p.y);fingers.delete(e.pointerId);points.delete(id);draw()}
pad.onpointerup=end;pad.onpointercancel=end;pad.onlostpointercapture=end;
function releaseAll(){for(const [id,p]of points)event(2,id,p.x,p.y);points.clear();fingers.clear();keys=false;draw()}
pad.onkeydown=e=>{if(!ready)return;if(e.code==='Space'){e.preventDefault();if(!keys){keys=true;const p={x:Number(pitch.value),y:level};points.set(9,p);event(0,9,p.x,p.y);draw()}}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();if(e.code==='ArrowLeft')pitch.value=Number(pitch.value)-.07;if(e.code==='ArrowRight')pitch.value=Number(pitch.value)+.07;level=Math.max(0,Math.min(1,level+(e.code==='ArrowUp'?.05:e.code==='ArrowDown'?-.05:0)));moveKey()}};
function moveKey(){if(keys){const p={x:Number(pitch.value),y:level};points.set(9,p);event(1,9,p.x,p.y);draw()}}
pad.onkeyup=e=>{if(e.code==='Space'&&keys){const p=points.get(9);event(2,9,p.x,p.y);points.delete(9);keys=false;draw()}};
pitch.oninput=moveKey;pad.onblur=releaseAll;release.onclick=releaseAll;join.onclick=connect;
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseAll();disconnect('Paused · rejoin when you return.')}});window.addEventListener('resize',draw);window.addEventListener('pagehide',()=>disconnect('Left session'));draw();
</script>
</html>
