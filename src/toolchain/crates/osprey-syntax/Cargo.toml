[package]
name = "osprey-syntax"
description = "Lowers the tree-sitter Osprey CST into the osprey-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
osprey-ast = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-osprey = { workspace = true }
# Matches the ABI of the workspace's tree-sitter 0.27 runtime.
tree-sitter-python = "=0.25.0"
# The pinned TypeScript parser of the TypeScript flavor ([FLAVOR-TS-CST]).
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_span = "=0.158.0"
oxc_syntax = "=0.158.0"

[lints]
workspace = true
