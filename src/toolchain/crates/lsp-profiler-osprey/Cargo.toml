[package]
name = "lsp-profiler-osprey"
description = "The Osprey runtime for lspkit's shared profiler: attaches to running Osprey programs through their live-attach endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lsp-profiler = { workspace = true }
osprey-profiler = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["net", "time", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }

[lints]
workspace = true
