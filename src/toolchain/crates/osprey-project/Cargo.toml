[package]
name = "osprey-project"
description = "Project loading, namespace assembly, and module resolution for Osprey"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
osprey-ast = { workspace = true }
osprey-syntax = { workspace = true }
# The discipline seam infers the export signature of an `hm` module a checker
# imports ([TYPES-DISCIPLINE-PROTOCOL]); the module-boundary tests type-check
# the ASSEMBLED program for the same reason.
osprey-types = { workspace = true }
# The checker protocol of [TYPES-DISCIPLINE-PROTOCOL] is JSON, like the
# language server's; nothing else in this crate serializes.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
