[package]
name = "osprey-gpui"
version = "0.1.0"
edition = "2021"
description = "The GPUI host of Osprey Native: the seam between GPUI and an Osprey application compiled as a C ABI library"
license = "MIT"
publish = false

[features]
# [CAST-MOBILE-GPUI] the unfinished mobile bridge's tests, which CI does not run.
mobile-bridge-tests = []

[dependencies]
gpui-kit = "0.8.1"
# Enable real-window frame readback on the selected renderer only.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["test-support"] }
# Decodes and turns scene sprite images; the same release GPUI decodes images with.
image = { version = "0.25", default-features = false, features = ["png"] }
# The same lyon GPUI tessellates with; only its stroke join type is named here.
lyon = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios = { package = "gpui-pre-ios", version = "=0.3.10" }

# [CAST-MOBILE-GPUI] the Android backend over gpui-pre-wgpu, one crate beside the host;
# the shared library this builds as is what NativeActivity loads.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
jni = "=0.21.1"
log = "0.4"
gpui_android = { package = "osprey-gpui-android", path = "android" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "osprey_gpui"
crate-type = ["lib", "cdylib"]

[profile.release]
debug = 1

[workspace]
members = ["android"]

