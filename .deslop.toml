# Deslop duplication gate (https://deslop.live/docs/for-ai/). CI and make lint run
# `deslop .`; it exits 3 above this ceiling, which only goes down.
[threshold]
max_duplication_percent = 4

# Generated files carry no banner Deslop recognises, so they are named here and
# never analysed: tree-sitter's parser, grammar JSON, node types and the runtime
# headers it copies beside each grammar, the CPython oracles' expected values and
# tables, and the files our own generators write.
[defaults]
exclude = [
  "src/toolchain/tree-sitter-osprey*/src/parser.c",
  "src/toolchain/tree-sitter-osprey*/src/grammar.json",
  "src/toolchain/tree-sitter-osprey*/src/node-types.json",
  "src/toolchain/tree-sitter-osprey*/src/tree_sitter/**",
  "src/osprey/**/tests/expected*.py",
  "src/osprey/packages/re/src/tables.py",
  "src/osprey/packages/tiktoken/src/tables.py",
  "src/osprey/packages/tokenizers/src/Category.py",
  "src/osprey/packages/tokenizers/src/NfcData.py",
  "src/osprey/examples/projects/modules/src/web/bundle.ospml",
  "src/osprey/examples/gpui/painting/src/logo.ospml",
  "src/toolchain/compiler/runtime/klee/hunt_format_cases.inc",
  "src/toolchain/website/src/_includes/benchmarks-tables.html",
]
