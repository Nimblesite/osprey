# Deslop duplication gate
# Single source of truth for this repo's code-duplication budget. Committed,
# PR-reviewed, ratcheted DOWN only — never up without a written justification.
# The official Deslop action in the REQUIRED `ci` job reads this file and exits non-zero —
# FAILING THE BUILD — when measured duplication exceeds the ceiling below. Deslop parses
# Rust/C#/Python/Dart, so this gates the Rust workspace (the C runtime is out
# of scope here).
# Docs: https://deslop.live/docs/for-ai/
# Local `make ci` uses the `deslop` target; hosted CI uses the official action.
# Both fail when measured duplication exceeds the ceiling below (deslop exits 3).
[threshold]
# Ceiling = 5% (2026-07-28). Measured product-code duplication is 5.0%
# (3175 / 63834 LOC) — a margin of roughly TWO lines. Adding a clone of any size
# fails the build; run `make deslop` before pushing rather than discovering it
# in CI. This is deliberate: the ceiling ratchets DOWN with the measurement, so
# it stays a ceiling rather than drifting into headroom.
#
# The 5% was reached by a round of genuine dedup: the three AST expression
# visitors
# (osprey-codegen `freevars`/`effects`, osprey-lsp `analysis`) now share one
# `osprey_ast::walk_each` collection-walker instead of each carrying its own
# `walk_all`/`walk_named`/`walk_fields` trio; `wire.rs`'s request-field
# accessors share a `nested` two-level lookup; and `default/lower.rs` folds its
# "collect children of a kind, lower each" sites into one `map_of_kind`. 8.0%
# remains the AUTHORISED HARD CAP — never raise above it. Worst remaining
# offenders are the `builtin_docs_*` documentation TABLES (repeated data rows,
# not logic — see the [category=data] note deslop prints) and structural-only
# CST-walk shapes that don't factor without obscuring intent.
max_duplication_percent = 5

[defaults]
exclude = [
  # Test code, in every layout the repo uses. The gate scopes to hand-written
  # PRODUCT code; test suites intentionally repeat setup/fixture scaffolding
  # (that repetition is what keeps each test independently readable), so
  # deduping them trades clarity for a metric. Covers Rust `tests/`, the VS Code
  # extension's `test/suite/` (DAP harness + e2e), and any `*.test.ts`.
  "**/tests/**",
  "**/test/**",
  "**/*.test.ts",
  # Vendored, generated tree-sitter grammar bindings — not hand-written.
  "tree-sitter-osprey/**",
  # Cross-language benchmark baselines: each case is a standalone single-file
  # program compiled in isolation by benchmarks/run.sh (no shared crate exists
  # to factor into), so the identical scaffolding across cases is intrinsic to
  # the benchmark design, not a refactorable product-code clone.
  "benchmarks/**",
  # One-off website build/generation tooling (e.g. add-ml-twins.py, which emits
  # the ML twin of each Default snippet for the docs). Same category as the
  # benchmark baselines above: standalone generator scripts, not the shipped
  # compiler product code the gate exists to guard. Their per-case scaffolding
  # is intrinsic to a code generator, not a refactorable product clone.
  "website/scripts/**",
  # Vendored, minified third-party JS (mermaid + katex ESM chunks) copied in by
  # `npm run build`. This dir is gitignored build output, NOT hand-written
  # product code — but deslop does NOT read .gitignore (only these explicit
  # patterns are honored), so without this line the minified chunk-*.mjs /
  # *Diagram-*.mjs bundles dominate the report as near-100% self-duplication and
  # blow past the ceiling. They duplicate by design and we don't own them.
  "website/src/assets/vendor/**",
  # Built-in documentation DATA tables: `builtin_doc!(name, description,
  # [params], example)` rows — one per builtin — fill these two files. deslop
  # counts them as Type-1 clones because every row is the same macro shape, but
  # the repetition is DATA enumeration, not duplicated logic: each row is unique
  # doc content in an identical container, and the macro is already the DRY
  # mechanism — there is nothing left to factor. This gate guards hand-written
  # logic, so scope the data tables out, the same call already made for the
  # benchmark baselines and generator scripts above.
  "**/builtin_docs_sys.rs",
  "**/builtin_docs_lang.rs",
]
