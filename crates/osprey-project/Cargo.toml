[package]
name = "osprey-project"
description = "Project loading, namespace assembly, and module resolution for Osprey"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
osprey-ast = { workspace = true }
osprey-syntax = { workspace = true }

# Type-checking the ASSEMBLED program is how the module-boundary tests prove a
# flattened project is still a well-typed program — the assembler alone cannot
# tell an unreachable constructor from a reachable one.
[dev-dependencies]
osprey-types = { workspace = true }

[lints]
workspace = true
